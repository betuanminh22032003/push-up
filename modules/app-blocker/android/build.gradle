plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.appblocker'
version = '1.0.0'

android {
  namespace "expo.modules.appblocker"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // BlockerEngine and Sites are plain Kotlin; their JUnit tests run on the JVM.
  testImplementation 'junit:junit:4.13.2'
}
