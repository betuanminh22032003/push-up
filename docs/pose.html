 * before it must be on the feet, so rolling over on the floor counts nothing.
 */
const BURPEE_DEFAULTS = {
  ...REP_BASE_DEFAULTS,
  minRangeDeg: 30,
  downAngleCeiling: 40,
  upAngleFloor: 60,
  downAngle: 30,
  upAngle: 70,
  partialAngle: 50,
  minRepMs: 1000,
  /** The body must be this straight in the plank... */
  minPlankLine: 150,
  /** ...judged on frames with the torso at most this far off horizontal. */
  plankTilt: 45,
  /** The legs' steepest frame in the rest before must be standing. */
  minStandLegTilt: 60,
};

function measureBurpeeFrame(pose, options = {}) {
  const opts = { ...BURPEE_DEFAULTS, ...options };
  if (!pose) return { tracking: false, torsoTilt: null, bodyLine: null, legTilt: null };
  const line = midlineOf(pose, opts);
  const torsoTilt = torsoTiltOf(line, opts);
  return {
    tracking: torsoTilt !== null,
    torsoTilt,
    bodyLine: line.ankle ? bodyLineOf(line, opts) : null,
    legTilt: line.ankle ? legTiltOf(line, opts) : null,
  };
}

function createBurpeeAnalyzer(options = {}) {
  const opts = { ...BURPEE_DEFAULTS, ...options };
  const engine = createRepEngine(opts, [
    {
      read: (frame) => (Number.isFinite(frame.torsoTilt) && frame.torsoTilt <= opts.plankTilt ? frame.bodyLine : null),
      keep: 'max',
      fails: (line) => line < opts.minPlankLine,
      issue: ISSUES.NOT_IN_POSITION,
      veto: true,
    },
    {
      read: (frame) => frame.legTilt,
      keep: 'max',
      fails: (tilt) => tilt < opts.minStandLegTilt,
      issue: ISSUES.NOT_UPRIGHT,
      veto: true,
      window: 'leadIn',
    },
  ]);
  return poseAnalyzer('burpee', engine, (pose) => measureBurpeeFrame(pose, opts), 'torsoTilt');
}



/**
 * Isometric holds: planks, side planks, wall sits, hollow holds, supermans and
 * arm circles. Nothing goes up and down, so there is nothing for the rep
 * engine to count; what counts is time spent in the position, and only while
 * the form is right.
 *
 * Each hold measures a frame and lists what is wrong with it (the same issue
 * vocabulary as the reps, ./repEngine). The hold engine below turns that into
 * seconds held, and the analyser reports them as reps — one per whole second
 * — with the same contract as every rep analyser (`reps`, `phase`, `reset()`,
 * `push()` returning { reps, phase, repCompleted, issues, tracking, ... }).
 * So the page, the stages and the workout screen count a plank exactly as they
 * count push-ups: the counter shows seconds, a target of 30 is 30 seconds, and
 * the history stores them as the session's total.
 *
 * Honest timing:
 *   startMs   the form must hold this long before the clock starts (then the
 *             wait is credited), so passing through a plank on the way to the
 *             floor is not a hold
 *   graceMs   a break shorter than this — one bad inference, a wobble — does
 *             not stop the hold, but its frames earn nothing
 *   maxGapMs  no single frame earns more than this, so a stalled camera or a
 *             paused set cannot credit the time it was away
 */

const HOLD_BASE_DEFAULTS = {
  minVisibility: 0.4,
  startMs: 400,
  graceMs: 500,
  maxGapMs: 250,
  /** One "rep" is a second held; also the app's fastest believable rep. */
  minRepMs: 1000,
  aspect: 1,
};

/**
 * @param {object} opts  startMs, graceMs, maxGapMs
 */
function createHoldEngine(opts) {
  let holding = false;
  let heldMs = 0;
  let goodSince = null;
  let badSince = null;
  let lastAt = null;

  return {
    get reps() {
      return Math.floor(heldMs / 1000);
    },
    get phase() {
      return holding ? 'down' : 'up';
    },
    get heldMs() {
      return heldMs;
    },
    reset() {
      holding = false;
      heldMs = 0;
      goodSince = null;
      badSince = null;
      lastAt = null;
    },
    /**
     * @param {string[]|null} issues  what is wrong with this frame; null when
     *                                the body is not tracked at all
     * @param {number} timestamp      milliseconds, monotonic
     */
    push(issues, timestamp) {
      const before = Math.floor(heldMs / 1000);
      const tracked = Array.isArray(issues);
      const good = tracked && issues.length === 0;
      const dt = lastAt === null ? 0 : Math.max(0, Math.min(timestamp - lastAt, opts.maxGapMs));
      lastAt = timestamp;

      if (good) {
        badSince = null;
        if (holding) {
          heldMs += dt;
        } else {
          if (goodSince === null) goodSince = timestamp;
          if (timestamp - goodSince >= opts.startMs) {
            holding = true;
            heldMs += timestamp - goodSince;
          }
        }
      } else {
        goodSince = null;
        if (holding) {
          if (badSince === null) badSince = timestamp;
          if (timestamp - badSince >= opts.graceMs) holding = false;
        }
      }

      const reps = Math.floor(heldMs / 1000);
      return {
        reps,
        phase: holding ? 'down' : 'up',
        repCompleted: reps > before,
        partialRep: false,
        issues: tracked ? issues : [ISSUES.LOST_TRACKING],
        tracking: tracked,
        holding,
        held: heldMs / 1000,
        thresholds: null,
      };
    },
  };
}

/**
 * The analyser around a hold engine: `measure(pose)` returns
 * { tracking, signal, issues, ...readings }.
 */
function holdAnalyzer(exercise, opts, measure) {
  const engine = createHoldEngine(opts);
  return {
    exercise,
    hold: true,
    get reps() {
      return engine.reps;
    },
    get phase() {
      return engine.phase;
    },
    reset() {
      engine.reset();
    },
    push(pose, timestamp) {
      const frame = measure(pose);
      const result = engine.push(frame.tracking ? frame.issues : null, timestamp);
      return { ...frame, ...result, signal: Number.isFinite(frame.signal) ? frame.signal : null };
    },
  };
}

/* --- plank, side plank ----------------------------------------------------- */

/**
 * A plank side-on, a side plank facing the camera: either way the picture is
 * a straight body near horizontal with the weight on an arm. Checks: torso
 * within maxTilt of level, shoulder-hip-ankle straight (no sag, no pike), and
 * an elbow or wrist well below the shoulders, so lying flat on the floor is
 * not a plank.
 */
const PLANK_DEFAULTS = {
  ...HOLD_BASE_DEFAULTS,
  maxTilt: 35,
  minBodyLine: 150,
  /** The lowest elbow or wrist, in torso lengths below the shoulders. */
  minArmSupport: 0.35,
};

const SIDE_PLANK_DEFAULTS = { ...PLANK_DEFAULTS, maxTilt: 45 };

function measurePlankFrame(pose, options = {}) {
  const opts = { ...PLANK_DEFAULTS, ...options };
  const none = { tracking: false, signal: null, issues: [], torsoTilt: null, bodyLine: null, support: null };
  if (!pose) return none;
  const line = midlineOf(pose, opts);
  const torsoTilt = torsoTiltOf(line, opts);
  const bodyLine = bodyLineOf(line, opts);
  if (torsoTilt === null || bodyLine === null) return none;
  const support = armSupportOf(pose, line, opts);
  const issues = [];
  if (torsoTilt > opts.maxTilt || !(support >= opts.minArmSupport)) issues.push(ISSUES.NOT_HORIZONTAL);
  if (bodyLine < opts.minBodyLine) issues.push(ISSUES.BODY_SAG);
  return { tracking: true, signal: bodyLine, issues, torsoTilt, bodyLine, support };
}

function createPlankAnalyzer(options = {}, exercise = 'plank') {
  const base = exercise === 'sideplank' ? SIDE_PLANK_DEFAULTS : PLANK_DEFAULTS;
  const opts = { ...base, ...options };
  return holdAnalyzer(exercise, opts, (pose) => measurePlankFrame(pose, opts));
}

/* --- wall sit -------------------------------------------------------------- */

/**
 * Side-on, back against a wall, thighs level. Checks: the knee (hip-knee-ankle)
 * between minKnee and maxKnee — about 90 — and the torso upright.
 */
const WALL_SIT_DEFAULTS = {
  ...HOLD_BASE_DEFAULTS,
  minKnee: 60,
  maxKnee: 120,
  minUprightTilt: 55,
};

function measureWallSitFrame(pose, options = {}) {
  const opts = { ...WALL_SIT_DEFAULTS, ...options };
  const none = { tracking: false, signal: null, issues: [], knee: null, torsoTilt: null };
  if (!pose) return none;
  const knee = eitherSide(perSide((s) => sideAngle(pose, s, ['Hip', 'Knee', 'Ankle'], opts)), (l, r) => (l + r) / 2);
  if (knee === null) return none;
  const torsoTilt = torsoTiltOf(midlineOf(pose, opts), opts);
  const issues = [];
  if (knee > opts.maxKnee) issues.push(ISSUES.SHALLOW);
  else if (knee < opts.minKnee) issues.push(ISSUES.NOT_IN_POSITION);
  if (Number.isFinite(torsoTilt) && torsoTilt < opts.minUprightTilt) issues.push(ISSUES.NOT_UPRIGHT);
  return { tracking: true, signal: knee, issues, knee, torsoTilt };
}

function createWallSitAnalyzer(options = {}) {
  const opts = { ...WALL_SIT_DEFAULTS, ...options };
  return holdAnalyzer('wallsit', opts, (pose) => measureWallSitFrame(pose, opts));
}

/* --- hollow hold, superman --------------------------------------------------- */

/**
 * Side-on, lying, with the shoulders and the legs both lifted off the floor and
 * the hips the low point: a banana shape on the back (hollow hold) or an arch
 * on the front (superman). The camera sees the same curve either way, so both
 * are this one check: torso and legs each lifted between minLift and maxLift
 * degrees, with the hips below both ends. Lying flat, either tilt is near 0;
 * sitting up, the torso is far past maxLift.
 */
const ARCH_DEFAULTS = {
  ...HOLD_BASE_DEFAULTS,
  minLift: 8,
  maxLift: 50,
};

const SUPERMAN_DEFAULTS = { ...ARCH_DEFAULTS, minLift: 5, maxLift: 40 };

function measureArchFrame(pose, options = {}) {
  const opts = { ...ARCH_DEFAULTS, ...options };
  const none = { tracking: false, signal: null, issues: [], torsoTilt: null, legTilt: null };
  if (!pose) return none;
  const line = midlineOf(pose, opts);
  if (!line.shoulder || !line.hip || !line.ankle) return none;
  const torsoTilt = torsoTiltOf(line, opts);
  const legTilt = legTiltOf(line, opts);
  const lifted = (tilt) => tilt >= opts.minLift && tilt <= opts.maxLift;
  // Image y grows downward: the hips must be the lowest of the three.
  const hipsLowest = line.hip.y > line.shoulder.y && line.hip.y > line.ankle.y;
  const issues = lifted(torsoTilt) && lifted(legTilt) && hipsLowest ? [] : [ISSUES.NOT_IN_POSITION];
  return { tracking: true, signal: bodyLineOf(line, opts), issues, torsoTilt, legTilt };
}

function createArchAnalyzer(options = {}, exercise = 'hollowhold') {
  const base = exercise === 'superman' ? SUPERMAN_DEFAULTS : ARCH_DEFAULTS;
  const opts = { ...base, ...options };
  return holdAnalyzer(exercise, opts, (pose) => measureArchFrame(pose, opts));
}

/* --- arm circles --------------------------------------------------------------- */

/**
 * Filmed from the front, standing, arms straight out to the sides at shoulder
 * height, circling. The circles themselves are small and fast — too small to
 * count one by one from a phone across the room — so the time with both arms
 * up and straight is what counts. Checks: both upper arms between minRaise and
 * maxRaise from the sides, both elbows straight, standing.
 */
const ARM_CIRCLE_DEFAULTS = {
  ...HOLD_BASE_DEFAULTS,
  minRaise: 60,
  maxRaise: 125,
  minElbow: 140,
  minUprightTilt: 55,
};

function measureArmCircleFrame(pose, options = {}) {
  const opts = { ...ARM_CIRCLE_DEFAULTS, ...options };
  const none = { tracking: false, signal: null, issues: [], raise: null, torsoTilt: null };
  if (!pose) return none;
  const raises = perSide((s) => sideAngle(pose, s, ['Hip', 'Shoulder', 'Elbow'], opts));
  const elbows = perSide((s) => sideAngle(pose, s, ['Shoulder', 'Elbow', 'Wrist'], opts));
  const low = bothSides(raises, Math.min);
  const high = bothSides(raises, Math.max);
  if (low === null) return none;
  const elbow = eitherSide(elbows, Math.min);
  const torsoTilt = torsoTiltOf(midlineOf(pose, opts), opts);
  const issues = [];
  if (low < opts.minRaise) issues.push(ISSUES.SHALLOW);
  else if (high > opts.maxRaise || (Number.isFinite(elbow) && elbow < opts.minElbow)) {
    issues.push(ISSUES.NOT_IN_POSITION);
  }
  if (Number.isFinite(torsoTilt) && torsoTilt < opts.minUprightTilt) issues.push(ISSUES.NOT_UPRIGHT);
  return { tracking: true, signal: low, issues, raise: low, torsoTilt };
}

function createArmCircleAnalyzer(options = {}) {
  const opts = { ...ARM_CIRCLE_DEFAULTS, ...options };
  return holdAnalyzer('armcircles', opts, (pose) => measureArmCircleFrame(pose, opts));
}

/**
 * The visibility gate: counting starts only once the camera has seen every
 * joint an exercise needs, confidently, for about a second.
 *
 * Before it, an analyser fed half a body learns its range from noise, and
 * the user sees a counter stuck at zero with no idea why. The gate instead
 * says which body part is out of frame ("legs"), and opens once the whole
 * set-up is right. It latches: once open it stays open for the set, and the
 * analysers' own lost-tracking handling takes over from there.
 *
 * Each exercise declares what it needs in ./analyzers.js (POSE_NEEDS), as a
 * list of groups:
 *   { joints: ['Shoulder', 'Elbow', 'Wrist'], sides: 'either' }
 *     'either'  all of them on one side (side-on, the far arm is hidden)
 *     'both'    all of them on both sides (front-on, e.g. both arms)
 *     'any'     each of them on at least one side
 * Joint names are JOINTS from ./landmarks without the side ('nose' has none).
 *
 * Pure and dependency-free: inlined into the pose page with the analysers.
 */

/** Which body part a joint belongs to, for telling the user what is missing. */
const PART_OF_JOINT = {
  nose: 'head',
  Shoulder: 'shoulders',
  Elbow: 'arms',
  Wrist: 'arms',
  Hip: 'hips',
  Knee: 'legs',
  Ankle: 'legs',
};

/** The order parts are named in, head to toe; 'body' means no one at all. */
const BODY_PARTS_ORDER = ['body', 'head', 'shoulders', 'arms', 'hips', 'legs'];

const GATE_DEFAULTS = {
  // Higher than the analysers' 0.4: a joint the model is unsure of at the
  // start is the one that flickers in and out mid-set.
  minScore: 0.6,
  holdMs: 1000,
  // One dropped frame does not restart the second.
  graceMs: 250,
};

const GATE_SIDES = ['left', 'right'];

function gateJointName(side, joint) {
  return joint === 'nose' ? 'nose' : side + joint;
}

/**
 * The body parts `needs` cannot see in this frame, head to toe; [] when
 * everything is in view, ['body'] when there is no pose at all.
 */
function missingParts(pose, needs, minScore = GATE_DEFAULTS.minScore) {
  if (!pose) return ['body'];
  const seen = (name) => {
    const p = pose[name];
    return !!p && Number.isFinite(p.score) && p.score >= minScore && Number.isFinite(p.x) && Number.isFinite(p.y);
  };
  const missingJoints = new Set();
  for (const group of needs) {
    const unseenOn = (side) => group.joints.filter((j) => !seen(gateJointName(side, j)));
    if (group.sides === 'both') {
      for (const side of GATE_SIDES) for (const j of unseenOn(side)) missingJoints.add(j);
    } else if (group.sides === 'any') {
      for (const j of group.joints) {
        if (!GATE_SIDES.some((side) => seen(gateJointName(side, j)))) missingJoints.add(j);
      }
    } else {
      // 'either': the better side; what it lacks is what to bring into view.
      const left = unseenOn('left');
      const right = unseenOn('right');
      for (const j of right.length < left.length ? right : left) missingJoints.add(j);
    }
  }
  const parts = new Set([...missingJoints].map((j) => PART_OF_JOINT[j] || 'body'));
  return BODY_PARTS_ORDER.filter((part) => parts.has(part));
}

/**
 * @param {Array} needs     the exercise's groups (see above)
 * @param {object} options  overrides for GATE_DEFAULTS
 * @returns {{ push(pose, now): {ready, visible, missing, progress}, reset(), ready: boolean }}
 */
function createVisibilityGate(needs, options = {}) {
  const opts = { ...GATE_DEFAULTS, ...options };
  let since = null;
  let lostAt = null;
  let ready = false;

  return {
    get ready() {
      return ready;
    },
    reset() {
      since = null;
      lostAt = null;
      ready = false;
    },
    push(pose, now) {
      const missing = missingParts(pose, needs, opts.minScore);
      const visible = missing.length === 0;
      if (ready) return { ready, visible, missing, progress: 1 };

      if (visible) {
        if (since === null) since = now;
        lostAt = null;
      } else if (since !== null) {
        if (lostAt === null) lostAt = now;
        if (now - lostAt > opts.graceMs) since = null;
      }
      const progress = since === null ? 0 : Math.min(1, (now - since) / opts.holdMs);
      if (visible && progress >= 1) ready = true;
      return { ready, visible, missing, progress };
    },
  };
}











/**
 * One way in to every pose analyser: pick by exercise id.
 *
 * The ids are the ones in src/exercises/exercises.js. This file does not import
 * that table: the generated pose page inlines everything under src/pose/ and
 * nothing else, and needs only the ids. scripts/verify-pose.mjs checks the two
 * lists agree.
 *
 * Every analyser has the same contract — `reps` and `phase` getters, `reset()`,
 * `push(pose, timestamp)` returning { reps, phase, repCompleted, partialRep,
 * issues, tracking, thresholds, signal, ...its own readings } — so the stages
 * and the page never branch on the exercise to count it. A hold (plank, wall
 * sit...) reports seconds held as its reps; see ./holdAnalyzers.
 *
 * Several exercises share an analyser under their own id: the push-up
 * variants bend the elbows as a push-up does, the squat family lowers the hips

/** Post a message to the React Native host (no-op in a plain browser). */
function send(payload) {
  try {
    window.ReactNativeWebView?.postMessage(JSON.stringify(payload));
  } catch (e) {
    /* standalone browser */
  }
}

/**
 * Hold the screen awake.
 *
 * Working out means not touching the phone, so the display sleeps on its
 * usual ~30s timeout and takes the camera with it — the page looks like it
 * "switched itself off" moments after the model finished loading. The app has
 * expo-keep-awake for this; the page needs its own.
 *
 * The lock is released automatically whenever the page is hidden, so it has to
 * be taken again every time we become visible, not just once at startup.
 */
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => {
      wakeLock = null;
      updateSysLine();
    });
  } catch (e) {
    wakeLock = null; // denied, or not allowed in this context
  }
  updateSysLine();
}

/**
 * Coming back from a hidden state: the wake lock is gone, the video element is
 * usually paused, and the interval may have been throttled to a standstill.
 * Restore all three rather than leaving a frozen preview on screen.
 */
async function handleVisible() {
  if (document.visibilityState !== 'visible') return;
  acquireWakeLock();
  try {
    if (videoEl.srcObject && videoEl.paused) await videoEl.play();
  } catch (e) {
    /* autoplay policy — the track listener below reports a dead camera */
  }
  if (landmarker && analyzer && !timer) {
    timer = setInterval(tick, FRAME_INTERVAL_MS);
  }
}

/** Report a camera that has stopped for good, instead of showing black. */
function watchStream(mediaStream) {
  mediaStream.getVideoTracks().forEach((track) => {
    track.addEventListener('ended', () => {
      setStatus('The camera stopped. Tap here to restart.', true);
      statusEl.onclick = () => {
        statusEl.onclick = null;
        location.reload();
      };
      send({ type: 'status', phase: 'error', code: 'cameraEnded', message: 'camera track ended' });
    });
  });
}

/**
 * @param {string|null} text     message, or null to hide
 * @param {boolean} isError      render in the error colour
 * @param {boolean} compact      banner across the top instead of a full cover,
 *                               for when the camera behind it should stay visible
 */
function setStatus(text, isError, compact) {
  // Inside the app, the app says all of this itself, in the user's language.
  if (!text || (EMBEDDED && !DEBUG)) {
    statusEl.classList.add('hidden');
    return;
  }
  statusEl.textContent = text;
  statusEl.classList.remove('hidden');
  statusEl.classList.toggle('error', !!isError);
  statusEl.classList.toggle('compact', !!compact);
}

function draw(pose, tracking) {
  const width = videoEl.videoWidth;
  const height = videoEl.videoHeight;
  if (!width || !height) return;
  if (canvasEl.width !== width || canvasEl.height !== height) {
    canvasEl.width = width;
    canvasEl.height = height;
  }

  const ctx = canvasEl.getContext('2d');
  ctx.clearRect(0, 0, width, height);
  if (!pose) return;

  const at = (joint) => {
    const p = pose[joint];
    if (!p || p.score < DRAW_MIN_SCORE) return null;
    return { x: p.x * width, y: p.y * height };
  };

  const colour = tracking ? ACCENT : FAINT;
  ctx.strokeStyle = colour;
  ctx.fillStyle = colour;
  ctx.lineWidth = Math.max(2, width / 180);
  ctx.lineCap = 'round';

  for (const bone of SKELETON_BONES) {
    const a = at(bone[0]);
    const b = at(bone[1]);
    if (!a || !b) continue;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  for (const joint of Object.keys(pose)) {
    const p = at(joint);
    if (!p) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(3, width / 240), 0, Math.PI * 2);
    ctx.fill();
  }
}

  try {

    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s || !s.frames) return;
    // Runs saved before there was more than one exercise were push-ups.
    const best = s.deepest != null ? s.deepest : s.deepestElbow;
    const deep = best == null ? 'never tracked' : best + '° best';
    const why = s.stuckAt && s.stuckAt !== 'ready' ? ' — stuck at: ' + s.stuckAt : '';

  },
  jumpingjack: {
    outOfFrame: ['Arms out of frame',
      'Both shoulders and elbows have to stay visible, overhead too. Step back from the phone.'],
    position: ['Stand up straight',
      'Face the camera, arms at your sides. Lying on the floor will not count.'],
    calibrating: ['Learning your range',
      'Do one full jumping jack — arms all the way overhead, then back to your sides — and counting starts.'],
  },
}[PAGE_EXERCISE] || {
  outOfFrame: ['Body out of frame',
    'Shoulders and hips have to be visible. Step back from the phone; the app says which side to face it.'],
  calibrating: ['Learning your range',
    'Do one full, slow rep and counting starts.'],
};

/**
 * What each exercise needs to see (`seen` tests one joint), and whether this
 * frame shows the wrong starting position for it.
 */
const SETUP_CHECKS = {
  pushup: {
    inFrame: (seen) => ['left', 'right'].some((side) =>
      seen(side + 'Shoulder') && seen(side + 'Elbow') && seen(side + 'Wrist')),
    misplaced: (r) => Number.isFinite(r.torsoTilt) && r.torsoTilt > PAGE_OPTS.maxTorsoTilt,
  },
  squat: {
    inFrame: (seen) => ['left', 'right'].some((side) =>
      seen(side + 'Hip') && seen(side + 'Knee') && seen(side + 'Ankle')),
    misplaced: (r) => Number.isFinite(r.torsoTilt) && r.torsoTilt < PAGE_OPTS.minUprightTilt,
  },
  situp: {
    inFrame: (seen) => ['Shoulder', 'Hip', 'Ankle'].every((joint) =>
      seen('left' + joint) || seen('right' + joint)),
    // The legs stay on the floor all through a sit-up, so they can be judged
    // on any frame without nagging mid-rep.
    misplaced: (r) => Number.isFinite(r.legTilt) && r.legTilt > PAGE_OPTS.maxLyingTilt,
  },
  jumpingjack: {
    inFrame: (seen) => ['left', 'right'].every((side) =>
      seen(side + 'Hip') && seen(side + 'Shoulder') && seen(side + 'Elbow')),
    misplaced: (r) => Number.isFinite(r.torsoTilt) && r.torsoTilt < PAGE_OPTS.minUprightTilt,
  },
}[PAGE_EXERCISE] || {
  // The other exercises' positions are their analysers' gates, reported as
  // issues; the page only checks that a body is there to judge.
  inFrame: (seen) => ['Shoulder', 'Hip'].every((joint) => seen('left' + joint) || seen('right' + joint)),
  misplaced: () => false,
};

let coachState = null;
let coachSince = 0;

/**
 * Work out which of the four silent failures is happening — no one in frame,
 * the joints this exercise needs out of frame, the wrong starting position, or
 * still learning the range — rather than leaving the screen at zero with no
 * explanation.
 */
function setupState(pose, result) {
  if (!pose) return 'noPose';
  // Until the visibility gate opens nothing is counted, whatever else is right.
  if (!gateState.ready) return 'outOfFrame';
  const seen = (j) => pose[j] && pose[j].score >= PAGE_OPTS.minVisibility;
  if (!SETUP_CHECKS.inFrame(seen)) return 'outOfFrame';
  if (!result) return 'ready';
  if (SETUP_CHECKS.misplaced(result)) return 'position';
  if (result.thresholds && !result.thresholds.adapted) return 'calibrating';
  return 'ready';
}

/** Names for the gate's body parts, for the browser's own coach card. */
const PART_TEXT = { body: 'your body', head: 'head', shoulders: 'shoulders', arms: 'arms', hips: 'hips', legs: 'legs' };

/**
 * Run the visibility gate on this frame and tell the app when what it says
 * changes: whether counting may start, which parts are out of frame, and how
 * far through the second of holding still it is (in quarters, so a frame
 * that changes nothing sends nothing).
 */
function updateGate(pose, now) {
  if (!gate) return;
  gateState = gate.push(pose, now);
  const progress = Math.floor(gateState.progress * 4) / 4;
  const key = gateState.ready + '|' + gateState.missing.join(',') + '|' + progress;
  if (key === gateSent) return;
  gateSent = key;
  send({ type: 'visibility', ready: gateState.ready, missing: gateState.missing, progress: progress });
}

/** Debounced so a single dropped frame does not flash a setup warning. */
function updateCoach(pose, result, now) {
  if (!hudEnabled) return;
  const state = setupState(pose, result);

  if (state !== coachState) {
    coachState = state;
    coachSince = now;
  }
  const settled = now - coachSince > 700;

  if (state === 'ready' || !settled) {
    if (state === 'ready') coachEl.classList.add('hidden');
    return;
  }

  let help = state === 'noPose' ? NO_POSE_HELP : SETUP_HELP[state];
  if (state === 'outOfFrame' && !gateState.ready && gateState.missing.length) {
    help = ['Not in frame: ' + gateState.missing.map((p) => PART_TEXT[p] || p).join(', '),
      (help || SETUP_HELP.outOfFrame)[1]];
  }
  if (!help) {
    coachEl.classList.add('hidden');
    return;
  }
  coachTitleEl.textContent = help[0];
  coachBodyEl.textContent = help[1];
  coachEl.classList.toggle('good', state === 'calibrating');
  coachEl.classList.remove('hidden');
}

function updateHud(result) {
  if (!hudEnabled) return;

  const now = performance.now();
  fpsWindow.push(now);
  while (fpsWindow.length && now - fpsWindow[0] > 1000) fpsWindow.shift();

  // Every analyser reports its signal under the same name, whatever it is
  // measuring; an untracked frame has none.
  const signal = result.signal;

  sessionFrames += 1;
  if (Number.isFinite(signal)) {
    trackedFrames += 1;
    deepestSignal = Math.min(deepestSignal, signal);
  }
  // Reset at the start of an effort, not when a rep completes: resetting on
  // completion immediately replaced a good depth with the angle of someone
  // back at rest, which then rendered red and read as a failure. Held this
  // way, the cell shows the best of the rep just finished until the next one
  // begins.
  if (result.phase === 'down' && prevPhase !== 'down') deepestSignal = Infinity;
  prevPhase = result.phase;

  hudReps.textContent = result.reps != null ? result.reps : 0;
  hudPhase.textContent = (result.phase || 'unknown').toUpperCase();
  hudPhase.className = result.phase === 'down' ? 'down' : result.phase === 'up' ? 'up' : '';
  hudSignal.textContent = fmtDeg(signal);

  // The targets are whatever the analyser is currently using, which adapt to
  // the range this person actually moves through.
  const needed = result.thresholds ? result.thresholds.down : PAGE_OPTS.downAngle;
  const restAt = result.thresholds ? result.thresholds.up : PAGE_OPTS.upAngle;
  hudDeepest.textContent = fmtDeg(deepestSignal);
  hudDeepestK.textContent =
    // A hold has no effort threshold, only a position to keep.
    HUD_SPEC.best + ' / ' + (Number.isFinite(needed) ? Math.round(needed) + '°' : '—') +
    (result.thresholds && result.thresholds.adapted ? ' AUTO' : '');
  hudDeepest.className =
    'v' + (Number.isFinite(deepestSignal) ? (deepestSignal <= needed ? ' ok' : ' bad') : '');
  lastNeeded = needed;

  if (now - lastSummaryWrite > 2000) {
    lastSummaryWrite = now;
    persistSummary(result.reps || 0);
    updateSysLine(); // refresh fps and tracked-percentage
  }

  hudSignal.className = 'v' + (Number.isFinite(signal) ? (signal <= needed ? ' ok' : '') : ' bad');
  HUD_SPEC.cells.forEach((cell, i) => {
    const value = cell[1](result);
    hudCellEls[i][1].textContent = cell[3](value);
    hudCellEls[i][1].className = 'v' + (Number.isFinite(value) && cell[2]
      ? (cell[2](value) ? ' bad' : ' ok') : '');
  });

  const issue = (result.issues || [])[0];
  if (result.repCompleted) {
    stickyIssue = null;
  } else if (issue) {
    stickyIssue = ISSUE_TEXT[issue] || issue;
    stickyIssueAt = now;
  } else if (stickyIssue && now - stickyIssueAt > ISSUE_STICKY_MS) {
    stickyIssue = null;
  }
  hudIssue.textContent = stickyIssue || '';

  // Effort bar: full at the effort threshold, empty back at rest.
  if (Number.isFinite(signal)) {
    const span = Math.max(1, restAt - needed);
    const pct = Math.max(0, Math.min(1, (restAt - signal) / span)) * 100;
    hudBarFill.style.width = pct.toFixed(0) + '%';
    hudBarFill.style.background = pct >= 100 ? '#4ADE80' : '#FBBF24';
  }

  if (trace.length < TRACE_LIMIT) {
    const row = {
      t: Math.round(now),
      signal: Number.isFinite(signal) ? +signal.toFixed(1) : null,
      phase: result.phase,
      reps: result.reps,
      rep: !!result.repCompleted,
      issues: result.issues && result.issues.length ? result.issues : undefined,
    };
    HUD_SPEC.cells.forEach((cell) => {
      const value = cell[1](result);
      row[cell[0].toLowerCase()] = Number.isFinite(value) ? +value.toFixed(2) : null;
    });
    trace.push(row);
  }
}

document.getElementById('hudReset').addEventListener('click', () => {
  if (analyzer) analyzer.reset();
  trace.length = 0;
  deepestSignal = Infinity;
  sessionFrames = 0;
  trackedFrames = 0;
  hudCopied.textContent = 'reset';
  setTimeout(() => { hudCopied.textContent = ''; }, 1200);
});

document.getElementById('hudCopy').addEventListener('click', async () => {
  const counted = trace.filter((r) => r.rep).length;
  const signals = trace.map((r) => r.signal).filter((v) => v != null);
  const payload = {
    exercise: PAGE_EXERCISE,
    signal: HUD_SPEC.signal,
    thresholds: PAGE_OPTS,
    summary: {
      frames: trace.length,
      countedReps: counted,
      minSignal: signals.length ? Math.min.apply(null, signals) : null,
      maxSignal: signals.length ? Math.max.apply(null, signals) : null,
      trackedFrames: signals.length,
    },
    trace: trace,
  };
  const text = JSON.stringify(payload);
  try {
    await navigator.clipboard.writeText(text);
    hudCopied.textContent = 'Copied ' + trace.length + ' frames, ' + counted + ' reps';
  } catch (e) {
    // Clipboard needs a user gesture and permission; fall back to selectable text.
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;bottom:0;left:0;width:100%;height:120px;z-index:99';
    document.body.appendChild(ta);
    ta.select();
    hudCopied.textContent = 'Select the text below and copy it';
  }
  setTimeout(() => { hudCopied.textContent = ''; }, 4000);
});

function tick() {
  if (!landmarker || !analyzer || videoEl.readyState < 2) return;

  const now = performance.now();
  const isNewFrame = videoEl.currentTime !== lastVideoTime;
  const isStale = now - lastInferenceAt >= STALE_FRAME_MS;
  if (!isNewFrame && !isStale) return;

  lastVideoTime = videoEl.currentTime;
  lastInferenceAt = now;

  try {
    const detection = landmarker.detectForVideo(videoEl, now);
    const raw = detection && detection.landmarks && detection.landmarks[0];
    const pose = raw ? fromMediaPipe(raw) : null;

    // The gate watches even while paused: the countdown before a set is
    // exactly when the user is getting into frame.
    updateGate(pose, now);

    if (paused || !gateState.ready) {
      if (!gateState.ready) updateCoach(pose, null, now);
      draw(pose, gateState.ready && !!pose);
    } else {
      const result = pose
        ? analyzer.push(pose, now)
        : { tracking: false, issues: [ISSUES.LOST_TRACKING], reps: analyzer.reps };

      if (result.repCompleted) {
        send({ type: 'rep', reps: result.reps, elbow: result.elbow });
      }
      send({
        type: 'frame',
        tracking: !!result.tracking,
        phase: result.phase,
        issues: result.issues || [],
        reps: result.reps,
        repCompleted: !!result.repCompleted,
      });
      updateHud(result);
      updateCoach(pose, result, now);
      draw(pose, result.tracking);
    }
    consecutiveErrors = 0;
  } catch (e) {
    consecutiveErrors += 1;
    if (consecutiveErrors === MAX_CONSECUTIVE_ERRORS) {
      setStatus('Pose detection keeps failing: ' + (e && e.message ? e.message : e), true);
      send({ type: 'status', phase: 'error', code: 'inference', message: String(e && e.message ? e.message : e) });
    }
  }
}

async function start() {
  try {
    setStatus('Starting camera…');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error(
        'This page must be served over HTTPS for camera access (getUserMedia is unavailable).',
      );
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false,
    });
    videoEl.srcObject = stream;
    watchStream(stream);
    await videoEl.play();
    await acquireWakeLock();

    // The camera is live from here on, so uncover it: the model download takes
    // a few seconds and that is exactly when someone wants to see the frame to
    // position the phone. Tell the app host too, so it can do the same.
    send({ type: 'status', phase: 'camera' });
    setStatus('Loading model… you can frame yourself now', false, true);
    const vision = await import(CDN + '/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks(CDN + '/wasm');

    // The GPU delegate is faster but fails or crashes outright on a fair
    // number of Android GPUs. Falling back to CPU costs frames; not falling
    // back costs the whole feature.
    const makeLandmarker = (delegate) =>
      vision.PoseLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: delegate },
        runningMode: 'VIDEO',
        numPoses: 1,
      });

    if (FORCE_CPU) {
      landmarker = await makeLandmarker('CPU');
      delegateUsed = 'CPU';
    } else {
      try {
        landmarker = await makeLandmarker('GPU');
        delegateUsed = 'GPU';
      } catch (gpuError) {
        setStatus('GPU unavailable, loading on CPU…', false, true);
        landmarker = await makeLandmarker('CPU');
        delegateUsed = 'CPU';
      }
    }

    analyzer = createAnalyzer(PAGE_EXERCISE, {
      aspect: (videoEl.videoWidth || 640) / (videoEl.videoHeight || 480),
    });
    gate = createExerciseGate(PAGE_EXERCISE);

    setStatus(null);
    // `exercise` is what this page counts, not what was asked for: the app
    // refuses to run on a page that would count the wrong thing.
    send({
      type: 'status',
      phase: 'ready',
      exercise: analyzer.exercise,
      version: PAGE_PROTOCOL_VERSION,
      gate: true,
    });

    // Inside the app the WebView sits behind the app's own counter, so the HUD
    // would just get in the way. Opened directly in a browser it is the point.
    hudEnabled = !EMBEDDED || DEBUG;
    hudEl.classList.toggle('hidden', !hudEnabled);
    updateSysLine();
    if (hudEnabled) showLastSummary();

    timer = setInterval(tick, FRAME_INTERVAL_MS);
  } catch (e) {
    const name = e && e.name;
    // What went wrong, for the app to put in the user's language: the camera
    // refused or held by another app, or (once the camera ran) the download.
    const code =
      name === 'NotAllowedError' || name === 'SecurityError'
        ? 'denied'
        : name === 'NotReadableError' || name === 'TrackStartError' || name === 'AbortError'
          ? 'busy'
          : stream
            ? 'load'
            : 'camera';
    const message =
      code === 'denied'
        ? 'Camera permission denied. Allow camera access, then reload.'
        : (e && e.message) || 'Could not start the camera.';
    setStatus(message, true);
    send({ type: 'status', phase: 'error', code, message });
  }
}

/** Commands from the React Native host. */
function handleCommand(rawData) {
  let msg;
  try {
    msg = JSON.parse(rawData);
  } catch (e) {
    return;
  }
  if (msg.type === 'pause') paused = true;
  else if (msg.type === 'resume') paused = false;
  else if (msg.type === 'reset') analyzer && analyzer.reset();
  // Back to waiting for the whole body, e.g. a new set after the user walked off.
  else if (msg.type === 'regate') {
    if (gate) gate.reset();
    gateSent = '';
  }
  else if (msg.type === 'mirror') {
    videoEl.classList.toggle('mirrored', !!msg.value);
    canvasEl.classList.toggle('mirrored', !!msg.value);
  }
}

// RN delivers injected messages on window on Android and document on iOS.
window.addEventListener('message', (e) => handleCommand(e.data));
document.addEventListener('message', (e) => handleCommand(e.data));

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    // Last chance to record the run: on mobile a page is often never given a
    // real unload, so a summary written only every 2s would lose the ending.
    persistSummary(analyzer ? analyzer.reps : 0);
  } else {
    handleVisible();
  }
});

/**
 * Only tear down on a real unload. The previous version stopped every track on
 * any `pagehide`, which also fires when the page goes into the back/forward
 * cache — so returning to it restored a page whose camera had been killed for
 * good, with nothing left to restart it.
 */
window.addEventListener('pagehide', (event) => {
  persistSummary(analyzer ? analyzer.reps : 0);
  if (event.persisted) return; // bfcache: we may be coming right back
  if (timer) clearInterval(timer);
  timer = null;
  if (stream) stream.getTracks().forEach((t) => t.stop());
});

start();
</script>
</body>
</html>
