<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>PUPG pose detector</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #video, #overlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  /* Mirrored so moving left on screen matches moving left in life. */
  #video.mirrored, #overlay.mirrored { transform: scaleX(-1); }
  #overlay { pointer-events: none; }
  #status {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    background: rgba(10,10,11,0.86); color: #8A8A93;
    font-size: 14px; line-height: 1.5;
  }
  #status.hidden { display: none; }
  #status.error { color: #F87171; }
  /*
   * Once the camera is live there is something worth looking at, so the status
   * stops covering it and becomes a banner. Framing yourself is the whole job
   * of those few seconds while the model downloads.
   */
  #status.compact {
    inset: auto 0 auto 0;
    top: calc(12px + env(safe-area-inset-top));
    margin: 0 12px;
    padding: 9px 14px;
    border-radius: 999px;
    background: rgba(10,10,11,0.82);
    border: 1px solid #26262C;
    font-size: 13px;
  }

  /* Diagnostic HUD: what the model actually reads, live, while you train. */
  #hud {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: rgba(10,10,11,0.86);
    border-top: 1px solid #26262C;
    color: #F5F5F7; font-variant-numeric: tabular-nums;
  }
  #hud.hidden { display: none; }
  #hudTop { display: flex; align-items: baseline; gap: 14px; }
  #hudReps { font-size: 40px; font-weight: 700; line-height: 1; }
  #hudPhase {
    font-size: 11px; font-weight: 700; letter-spacing: 1.4px;
    padding: 3px 9px; border-radius: 999px; border: 1px solid #55555E; color: #8A8A93;
  }
  #hudPhase.down { border-color: #FBBF24; color: #FBBF24; }
  #hudPhase.up { border-color: #4ADE80; color: #4ADE80; }
  #hudIssue { margin-left: auto; font-size: 12px; color: #FBBF24; text-align: right; }
  #hudGrid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 6px; margin-top: 10px;
  }
  .cell { background: #131316; border: 1px solid #26262C; border-radius: 8px; padding: 6px 4px; text-align: center; }
  .cell .k { display: block; font-size: 9px; letter-spacing: 1px; color: #55555E; }
  .cell .v { display: block; font-size: 17px; font-weight: 600; margin-top: 2px; }
  .cell .v.ok { color: #4ADE80; }
  .cell .v.bad { color: #F87171; }
  #hudBar { height: 6px; background: #26262C; border-radius: 3px; margin-top: 10px; overflow: hidden; }
  #hudBarFill { height: 100%; width: 0%; background: #4ADE80; transition: width 80ms linear; }
  #hudActions { display: flex; gap: 8px; margin-top: 10px; }
  #hudActions button {
    flex: 1; padding: 10px; font-size: 13px; font-weight: 600;
    background: #1C1C21; color: #F5F5F7;
    border: 1px solid #26262C; border-radius: 8px;
  }
  #hudActions button:active { opacity: 0.6; }
  #hudCopied { font-size: 11px; color: #4ADE80; text-align: center; margin-top: 6px; min-height: 14px; }
  #hudSys { font-size: 10px; color: #55555E; text-align: center; letter-spacing: 0.4px; }
  #hudSys .warn { color: #FBBF24; }

  /*
   * Setup coach. "Zero reps" has four different causes that look identical on
   * screen — no person found, the joints that matter out of frame, not in the
   * starting position, or still learning the range. Naming the actual one is the difference between
   * a user who can fix it and a user who just sees nothing happen.
   */
  #coach {
    position: absolute; left: 12px; right: 12px;
    top: 50%; transform: translateY(-50%);
    padding: 18px 20px; border-radius: 16px;
    background: rgba(10,10,11,0.88); border: 1px solid #26262C;
    text-align: center;
  }
  #coach.hidden { display: none; }
  #coach.good { border-color: #4ADE80; }
  #coachTitle { font-size: 18px; font-weight: 700; color: #F5F5F7; }
  #coachBody { font-size: 13px; color: #8A8A93; margin-top: 6px; line-height: 1.45; }
</style>
</head>
<body>
  <video id="video" class="mirrored" playsinline muted autoplay></video>
  <canvas id="overlay" class="mirrored"></canvas>
  <div id="status">Starting camera…</div>

  <div id="coach" class="hidden">
    <div id="coachTitle"></div>
    <div id="coachBody"></div>
  </div>

  <div id="hud" class="hidden">
    <div id="hudTop">
      <span id="hudReps">0</span>
      <span id="hudPhase">—</span>
      <span id="hudIssue"></span>
    </div>
    <div id="hudGrid">
      <div class="cell"><span class="k" id="hudSignalK">ELBOW</span><span class="v" id="hudSignal">—</span></div>
      <div class="cell"><span class="k" id="hudDeepestK">DEEPEST</span><span class="v" id="hudDeepest">—</span></div>
      <div class="cell"><span class="k" id="hudAK">BODY</span><span class="v" id="hudA">—</span></div>
      <div class="cell"><span class="k" id="hudBK">TILT</span><span class="v" id="hudB">—</span></div>
    </div>
    <div id="hudFps" hidden></div>
    <div id="hudBar"><div id="hudBarFill"></div></div>
    <div id="hudActions">
      <button id="hudReset" type="button">Reset</button>
      <button id="hudCopy" type="button">Copy log</button>
    </div>
    <div id="hudCopied"></div>
    <div id="hudSys"></div>
  </div>

<script>
/* ------------------------------------------------------------------------
 * Shared detection core, injected verbatim by scripts/build-pose-page.mjs
 * from src/pose/ (geometry, landmarks, the rep engine, one analyser per
 * exercise, and analyzers.js to pick between them).
 *
 * DO NOT EDIT the injected block: edit those modules and rebuild. They are
 * the same files the Node test suite exercises, so this page and the app
 * count reps by identical rules.
 * --------------------------------------------------------------------- */
/**
 * Geometry helpers over normalised pose landmarks.
 *
 * Landmarks arrive normalised per axis (x and y both 0..1), which silently
 * distorts angles on any non-square frame: on a 16:9 image one unit of x is
 * 1.78x wider than one unit of y, so an arm at a true 90 degrees measures as
 * something else. Every function here takes the frame's aspect ratio
 * (width / height) and restores real proportions before measuring.
 */

/** Euclidean distance, aspect-corrected. */
function distance(a, b, aspect = 1) {
  if (!a || !b) return null;
  const dx = (a.x - b.x) * aspect;
  const dy = a.y - b.y;
  return Math.hypot(dx, dy);
}

/**
 * Interior angle at vertex `b`, in degrees (0..180), between rays b->a and b->c.
 * Returns null if any point is missing or two points coincide.
 */
function angleAt(a, b, c, aspect = 1) {
  if (!a || !b || !c) return null;

  const abx = (a.x - b.x) * aspect;
  const aby = a.y - b.y;
  const cbx = (c.x - b.x) * aspect;
  const cby = c.y - b.y;

  const magAB = Math.hypot(abx, aby);
  const magCB = Math.hypot(cbx, cby);
  if (magAB === 0 || magCB === 0) return null;

  const cosine = (abx * cbx + aby * cby) / (magAB * magCB);
  // Floating point can push the quotient a hair outside acos's domain.
  return (Math.acos(Math.min(1, Math.max(-1, cosine))) * 180) / Math.PI;
}

/** True when every joint named is present and confident enough. */
function allVisible(pose, joints, minVisibility) {
  return joints.every((j) => pose[j] && pose[j].score >= minVisibility);
}

/** Mean of the values that are actually numbers; null when none are. */
function meanDefined(values) {
  const defined = values.filter((v) => Number.isFinite(v));
  if (defined.length === 0) return null;
  return defined.reduce((sum, v) => sum + v, 0) / defined.length;
}

/**
 * Angle of the torso against the horizontal, in degrees (0..90).
 *
 * A push-up is performed roughly horizontal. A near-vertical torso means the
 * subject is standing, so whatever the arms are doing is not a push-up — this
 * is what stops arm-waving at the camera from running up a count.
 */
function torsoTiltFromHorizontal(pose, aspect = 1) {
  const shoulder = midpoint(pose.leftShoulder, pose.rightShoulder, aspect);
  const hip = midpoint(pose.leftHip, pose.rightHip, aspect);
  if (!shoulder || !hip) return null;

  const dx = Math.abs(shoulder.x - hip.x) * aspect;
  const dy = Math.abs(shoulder.y - hip.y);
  if (dx === 0 && dy === 0) return null;

  return (Math.atan2(dy, dx) * 180) / Math.PI;
}

/** Midpoint of two joints; falls back to whichever one exists. */
function midpoint(a, b) {
  if (a && b) return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, score: Math.min(a.score, b.score) };
  return a || b || null;
}

/**
 * Midpoint of a left/right pair from only the joints confident enough to
 * trust: a guessed far-side hip must not drag the hip somewhere it is not.
 * Null when neither is.
 */
function seenMidpoint(pose, left, right, minVisibility) {
  const seen = (j) => (pose[j] && pose[j].score >= minVisibility ? pose[j] : null);
  return midpoint(seen(left), seen(right));
}

/**
 * Angle of the line a-b against the horizontal, in degrees (0..90), whichever
 * way it points. Null when an end is missing or the two coincide.
 */
function tiltFromHorizontal(a, b, aspect = 1) {
  if (!a || !b) return null;
  const dx = Math.abs(a.x - b.x) * aspect;
  const dy = Math.abs(a.y - b.y);
  if (dx === 0 && dy === 0) return null;
  return (Math.atan2(dy, dx) * 180) / Math.PI;
}

/**
 * A single normalised skeleton shape, so the rep analyser never learns which
 * model produced a frame.
 *
 * Pose models disagree on both the number of keypoints and their order:
 * MediaPipe BlazePose emits 33, MoveNet emits 17, and the indices do not line
 * up. Everything downstream consumes the named joints below instead, with one
 * adapter per model translating into it.
 *
 * Coordinates are normalised to the image: x and y in 0..1, origin top-left.
 * `score` is 0..1 confidence. A joint the model could not place is `null`.
 */

const JOINTS = [
  'nose',
  'leftShoulder',
  'rightShoulder',
  'leftElbow',
  'rightElbow',
  'leftWrist',
  'rightWrist',
  'leftHip',
  'rightHip',
  'leftKnee',
  'rightKnee',
  'leftAnkle',
  'rightAnkle',
];

/** MediaPipe Pose Landmarker (BlazePose, 33 points) -> joint name. */
const MEDIAPIPE_INDEX = {
  nose: 0,
  leftShoulder: 11,
  rightShoulder: 12,
  leftElbow: 13,
  rightElbow: 14,
  leftWrist: 15,
  rightWrist: 16,
  leftHip: 23,
  rightHip: 24,
  leftKnee: 25,
  rightKnee: 26,
  leftAnkle: 27,
  rightAnkle: 28,
};

/** MoveNet / PoseNet (COCO, 17 points) -> joint name. */
const MOVENET_INDEX = {
  nose: 0,
  leftShoulder: 5,
  rightShoulder: 6,
  leftElbow: 7,
  rightElbow: 8,
  leftWrist: 9,
  rightWrist: 10,
  leftHip: 11,
  rightHip: 12,
  leftKnee: 13,
  rightKnee: 14,
  leftAnkle: 15,
  rightAnkle: 16,
};

function point(raw, scoreKey) {
  if (!raw) return null;
  const x = raw.x;
  const y = raw.y;
  if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
  const score = raw[scoreKey];
  return { x, y, score: Number.isFinite(score) ? score : 1 };
}

function adapt(indexMap, scoreKey) {
  return (raw) => {
    const pose = {};
    if (!Array.isArray(raw)) {
      for (const joint of JOINTS) pose[joint] = null;
      return pose;
    }
    for (const joint of JOINTS) {
      pose[joint] = point(raw[indexMap[joint]], scoreKey);
    }
    return pose;
  };
}

/**
 * MediaPipe reports `visibility`; MoveNet reports `score`. Both mean "how sure
 * am I this joint is where I say it is", which is what the analyser gates on.
 */
const fromMediaPipe = adapt(MEDIAPIPE_INDEX, 'visibility');
const fromMoveNet = adapt(MOVENET_INDEX, 'score');

/** Bones to draw for the skeleton overlay. */
const SKELETON_BONES = [
  ['leftShoulder', 'rightShoulder'],
  ['leftShoulder', 'leftElbow'],
  ['leftElbow', 'leftWrist'],
  ['rightShoulder', 'rightElbow'],
  ['rightElbow', 'rightWrist'],
  ['leftShoulder', 'leftHip'],
  ['rightShoulder', 'rightHip'],
  ['leftHip', 'rightHip'],
  ['leftHip', 'leftKnee'],
  ['leftKnee', 'leftAnkle'],
  ['rightHip', 'rightKnee'],
  ['rightKnee', 'rightAnkle'],
];

/**
 * The rep counter every pose analyser runs on.
 *
 * Push-ups, squats, sit-ups and jumping jacks look nothing alike to a camera,
 * but counting them is one problem. Each frame gives one number — the signal —
 * that sits high at rest and drops at the point of effort: the elbow angle of
 * a push-up, the knee angle of a squat. A rep is one rest -> effort -> rest
 * cycle, counted on the return to rest so the number matches completed reps
 * rather than attempts, the same rule the proximity path uses.
 *
 * An analyser's only job is to turn a skeleton into that signal plus the
 * readings its posture gates judge (see ./pushupAnalyzer and its siblings).
 * Everything that keeps the count honest lives here, once, so a fix to the
 * counting rules reaches every exercise:
 *
 *   hysteresis     separate effort/rest thresholds (downAngle / upAngle), so a
 *                  signal hovering on one boundary cannot oscillate and
 *                  inflate the count
 *   minPhaseMs     a phase must hold before it is committed, rejecting jitter
 *                  from a single bad inference
 *   minRepMs       the fastest believable gap between two reps
 *   adaptation     thresholds follow the range this person actually moves
 *                  through, inside absolute limits so a twitch is never a rep
 *   posture gates  judged on the rep's best frame, so one noisy inference
 *                  cannot veto good work
 *
 * Phases keep the push-up's names whatever the body does: 'up' is rest and
 * 'down' is effort, so a jumping jack with its arms overhead is 'down'. The
 * page and the app already speak in those two words.
 *
 * Pure and deterministic: same frames in, same reps out, with all timing taken
 * from the caller's timestamps rather than the clock.
 */

/**
 * Why a frame or a rep did not count. Every analyser reports in this one
 * vocabulary, so the app needs one table of coaching messages, not four.
 *
 *   lostTracking   the joints the signal needs are not visible
 *   shallow        a dip that never reached the effort threshold
 *   bodySag        push-up: hips sagging or piking
 *   notHorizontal  push-up: not in a push-up position
 *   notUpright     squat, jumping jack: not standing
 *   notLying       sit-up: did not start from lying on the back
 */
const ISSUES = {
  LOST_TRACKING: 'lostTracking',
  SHALLOW: 'shallow',
  BODY_SAG: 'bodySag',
  NOT_HORIZONTAL: 'notHorizontal',
  NOT_UPRIGHT: 'notUpright',
  NOT_LYING: 'notLying',
};

/**
 * @param {object} opts  the analyser's merged options; the engine reads
 *   autoCalibrate, calibrationWindowMs, minRangeDeg, rangeFraction,
 *   downAngleCeiling, upAngleFloor, downAngle, upAngle, partialAngle,
 *   minPhaseMs and minRepMs. Every signal is in degrees, so the names fit all.
 * @param {Array} checks  posture gates, each
 *   {
 *     read(readings) -> number|null   this frame's value
 *     keep: 'min' | 'max'             which end of the window is its best
 *     fails(best) -> boolean          whether the best value is still wrong
 *     issue                           reported when it fails
 *     veto                            whether failing also refuses the rep
 *     window: 'rep' | 'leadIn'        what the best is taken over (below);
 *                                     'rep' when left out
 *   }
 *
 * A 'rep' check looks at the rep itself, from the moment the effort is
 * committed to the return to rest. A 'leadIn' check looks at the rest before
 * the effort instead, from the end of the previous rep, and is judged as the
 * effort begins — "started from lying down" is a question about where the rep
 * came from, which the rep's own frames cannot answer. Its issue is reported
 * then, so the advice arrives in time to act on, and again if the rep is
 * refused for it. A check with no readable frame at all passes: unknown is not
 * wrong.
 */
function createRepEngine(opts, checks = []) {
  let phase = 'unknown'; // 'unknown' | 'up' (rest) | 'down' (effort)
  let reps = 0;
  let lastRepAt = -Infinity;

  let candidate = null; // phase we are waiting to confirm
  let candidateSince = 0;

  // A dip taken while still at rest, i.e. one that never got deep enough to
  // commit an effort. Tracked outside the phase machine because a shallow dip
  // produces no phase change for the machine to react to.
  let inDip = false;
  let dipMin = Infinity;

  /** Recent signal values, for deriving this person's range of movement. */
  let samples = [];

  /** Best reading of each check over its window so far. */
  let best = checks.map(startOf);

  function startOf(check) {
    return check.keep === 'max' ? -Infinity : Infinity;
  }

  function fold(i, readings) {
    const value = checks[i].read(readings);
    if (!Number.isFinite(value)) return;
    best[i] = checks[i].keep === 'max' ? Math.max(best[i], value) : Math.min(best[i], value);
  }

  function failed(i) {
    return Number.isFinite(best[i]) && checks[i].fails(best[i]);
  }

  /**
   * Thresholds for the current frame: adapted to the observed range once there
   * is enough of it, otherwise the fixed fallbacks. Clamped so a small range
   * cannot turn a twitch into a rep.
   */
  function thresholdsFor(signal, timestamp) {
    if (!opts.autoCalibrate) {
      return { down: opts.downAngle, up: opts.upAngle, adapted: false };
    }

    samples.push({ t: timestamp, value: signal });
    const cutoff = timestamp - opts.calibrationWindowMs;
    if (samples.length > 4 && samples[0].t < cutoff) {
      samples = samples.filter((s) => s.t >= cutoff);
    }

    let min = Infinity;
    let max = -Infinity;
    for (const s of samples) {
      if (s.value < min) min = s.value;
      if (s.value > max) max = s.value;
    }

    const range = max - min;
    if (!Number.isFinite(range) || range < opts.minRangeDeg) {
      return { down: opts.downAngle, up: opts.upAngle, adapted: false };
    }

    const margin = range * opts.rangeFraction;
    return {
      down: Math.min(min + margin, opts.downAngleCeiling),
      up: Math.max(max - margin, opts.upAngleFloor),
      adapted: true,
      observedMin: min,
      observedMax: max,
    };
  }

  function clearDip() {
    inDip = false;
    dipMin = Infinity;
  }

  return {
    get reps() {
      return reps;
    },

    get phase() {
      return phase;
    },

    reset() {
      phase = 'unknown';
      reps = 0;
      lastRepAt = -Infinity;
      candidate = null;
      candidateSince = 0;
      samples = [];
      clearDip();
      best = checks.map(startOf);
    },

    /**
     * Feed one frame.
     * @param {number|null} signal  low = effort; not a number = not tracked
     * @param {object} readings     whatever the checks read
     * @param {number} timestamp    milliseconds, monotonic
     */
    push(signal, readings, timestamp) {
      if (!Number.isFinite(signal)) {
        // Hold the phase rather than guessing: a dropped frame mid-rep must
        // not be read as the subject having come back to rest.
        candidate = null;
        return {
          reps,
          phase,
          repCompleted: false,
          partialRep: false,
          issues: [ISSUES.LOST_TRACKING],
          tracking: false,
          thresholds: null,
          signal: null,
        };
      }

      checks.forEach((check, i) => {
        // A lead-in stops gathering once the effort starts: what happens
        // during the rep says nothing about where it started from.
        if (check.window !== 'leadIn' || phase !== 'down') fold(i, readings);
      });

      const limits = thresholdsFor(signal, timestamp);

      // Instantaneous reading; null in the hysteresis band, where we hold.
      let observed = null;
      if (signal <= limits.down) observed = 'down';
      else if (signal >= limits.up) observed = 'up';

      let repCompleted = false;
      let partialRep = false;
      const issues = [];

      // Shallow-dip detection, before the phase machine. A dip that never
      // crosses the effort threshold gives the machine nothing to see — but
      // "go further" is exactly the feedback that moment calls for.
      if (phase === 'up') {
        if (signal < limits.up) {
          inDip = true;
          dipMin = Math.min(dipMin, signal);
        } else if (inDip) {
          // "Too shallow to count" is relative to where the effort threshold
          // actually sits, so the advice stays honest under adaptation. A dip
          // that never got within (upAngle - partialAngle) of it is noise or
          // fidgeting, not an attempt.
          const wasShallow = dipMin <= limits.down + (opts.upAngle - opts.partialAngle);
          clearDip();
          if (wasShallow) {
            partialRep = true;
            issues.push(ISSUES.SHALLOW);
          }
        }
      }

      if (observed && observed !== phase) {
        if (candidate !== observed) {
          candidate = observed;
          candidateSince = timestamp;
        }

        if (timestamp - candidateSince >= opts.minPhaseMs) {
          const previous = phase;
          phase = observed;
          candidate = null;

          if (phase === 'down') {
            // A real effort supersedes any dip we were tracking, so it must
            // not also be reported as a shallow rep on the way back.
            clearDip();
            checks.forEach((check, i) => {
              if (check.window === 'leadIn') {
                if (failed(i)) issues.push(check.issue);
              } else {
                best[i] = startOf(check);
                fold(i, readings);
              }
            });
          }

          if (phase === 'up' && previous === 'down') {
            // A full cycle finished. Decide whether it earns a count: a failed
            // check with a veto refuses it, and so does arriving impossibly
            // soon after the last one. A failed check without one is advice.
            let vetoed = false;
            checks.forEach((check, i) => {
              if (!failed(i)) return;
              issues.push(check.issue);
              if (check.veto) vetoed = true;
            });

            if (!vetoed && timestamp - lastRepAt >= opts.minRepMs) {
              reps += 1;
              lastRepAt = timestamp;
              repCompleted = true;
            }
            clearDip();
            best = checks.map(startOf);
          }
        }
      } else if (observed === phase) {
        candidate = null;
      }

      return {
        reps,
        phase,
        repCompleted,
        partialRep,
        issues,
        tracking: true,
        thresholds: limits,
        signal,
      };
    },
  };
}

/**
 * The analyser object every exercise hands out, around an engine: measure the
 * skeleton, feed the signal and readings in, and return the engine's verdict
 * with the readings alongside, for the UI and the debug HUD.
 *
 * @param {string} exercise   which exercise this counts (an exercise id)
 * @param {object} engine     from createRepEngine
 * @param {Function} measure  (pose, timestamp) -> { tracking, [signalKey], ...readings };
 *   the timestamp is for a measure that keeps a little state of its own (the
 *   squat's standing height)
 * @param {string} signalKey  which reading is the signal
 * @param {Function} [onReset]  clears that state when the analyser is reset
 */
function poseAnalyzer(exercise, engine, measure, signalKey, onReset) {
  return {
    exercise,

    get reps() {
      return engine.reps;
    },

    get phase() {
      return engine.phase;
    },

    reset() {
      engine.reset();
      if (onReset) onReset();
    },

    /**
     * Feed one pose frame.
     * @param {object} pose       normalised joints (see ./landmarks)
     * @param {number} timestamp  milliseconds, monotonic
     */
    push(pose, timestamp) {
      const frame = measure(pose, timestamp);
      return { ...frame, ...engine.push(frame[signalKey], frame, timestamp) };
    },
  };
}



/**
 * Counts push-ups from a stream of pose frames.
 *
 * The signal is the elbow angle (shoulder-elbow-wrist): ~170 degrees at the top
 * of a push-up, ~80 at the bottom. A rep is one down-then-up cycle, counted on
 * the way back up so the number matches completed reps rather than attempts —
 * the same rule the proximity path uses.
 *
 * Four things keep the count honest:
 *
 *   hysteresis     separate down/up thresholds, so an angle hovering on one
 *                  boundary cannot oscillate and inflate the count
 *   minPhaseMs     a phase must hold before it is committed, rejecting jitter
 *                  from a single bad inference
 *   minRepMs       the same 500ms floor between reps used elsewhere
 *   form gates     torso must be roughly horizontal and the body straight,
 *                  so arm-waving at the camera counts nothing
 *
 * The counting itself is ./repEngine, shared with the other exercises; this
 * file decides what to measure and which form gates apply.
 *
 * The analyser is pure and deterministic: same frames in, same reps out, with
 * all timing taken from the caller's timestamps rather than the clock. That is
 * what makes it testable without a camera.
 */

const DEFAULTS = {
  /**
   * Adapt the thresholds to the range of movement actually observed.
   *
   * Fixed angles do not survive the projection: the elbow angle is measured on
   * a flat image, so a camera off the plane of the arm flattens it. Someone
   * going properly to the floor can measure 115 degrees, never cross a fixed
   * 100-degree threshold, and get no reps and no explanation. Deriving the
   * thresholds from each person's own observed range removes that failure,
   * and removes the per-setup tuning it would otherwise need.
   */
  autoCalibrate: true,
  /** How far back the observed range is measured. */
  calibrationWindowMs: 20000,
  /** Movement smaller than this is not a rep, it is noise or fidgeting. */
  minRangeDeg: 25,
  /** Where in the observed range the down/up thresholds sit. */
  rangeFraction: 0.3,
  /**
   * Absolute limits the adapted thresholds may not cross. Without these,
   * adapting to a tiny range would make a shallow twitch count as a full rep —
   * the arms still have to actually bend.
   */
  downAngleCeiling: 120,
  upAngleFloor: 140,

  /** Fallback thresholds, used until a range is known (or with autoCalibrate off). */
  downAngle: 100,
  /** Elbow angle at or above which the arms count as extended (top). */
  upAngle: 150,
  /** A dip past this that never reaches downAngle is a partial rep. */
  partialAngle: 135,
  /** Minimum landmark confidence before a joint is trusted. */
  minVisibility: 0.4,
  /** How long a phase must hold before it is committed. */
  minPhaseMs: 150,
  /** Minimum gap between two counted reps. */
  minRepMs: 500,
  /** Shoulder-hip-knee angle below which the body is sagging or piking. */
  straightBodyMinAngle: 150,
  /**
   * Whether bad body position *rejects* a rep rather than just warning.
   *
   * Off by default, because the measurement is not trustworthy enough to
   * refuse work over. The shoulder-hip-knee angle is read off a flat image, so
   * foreshortening from any camera not square to the body pulls it well below
   * 150 degrees even when the person is perfectly straight — the same
   * projection problem that made fixed elbow thresholds fail. Rejecting on it
   * meant a full set of real push-ups counted zero. The issue is still
   * reported, so the coaching is unchanged; only the veto is gone.
   */
  requireStraightBody: false,
  /**
   * Torso must get within this many degrees of horizontal at some point in the
   * rep. Judged on the best frame of the rep, not every frame: a single noisy
   * inference used to veto an otherwise good rep.
   */
  maxTorsoTilt: 55,
  /** Frame aspect ratio (width / height) for angle correction. */
  aspect: 1,
};

/**
 * The shared vocabulary (./repEngine), re-exported for code written when this
 * was the only analyser. New code imports it from ./analyzers.
 */

const ARM_JOINTS = {
  left: ['leftShoulder', 'leftElbow', 'leftWrist'],
  right: ['rightShoulder', 'rightElbow', 'rightWrist'],
};

const BODY_JOINTS = {
  left: ['leftShoulder', 'leftHip', 'leftKnee'],
  right: ['rightShoulder', 'rightHip', 'rightKnee'],
};

function elbowAngle(pose, side, opts) {
  const joints = ARM_JOINTS[side];
  if (!allVisible(pose, joints, opts.minVisibility)) return null;
  const [shoulder, elbow, wrist] = joints.map((j) => pose[j]);
  return angleAt(shoulder, elbow, wrist, opts.aspect);
}

function bodyAngle(pose, side, opts) {
  const joints = BODY_JOINTS[side];
  if (!allVisible(pose, joints, opts.minVisibility)) return null;
  const [shoulder, hip, knee] = joints.map((j) => pose[j]);
  return angleAt(shoulder, hip, knee, opts.aspect);
}

/**
 * Measure one frame without any state. Exported so the UI can show live angles
 * and so the thresholds can be inspected in isolation.
 */
function measureFrame(pose, options = {}) {
  const opts = { ...DEFAULTS, ...options };
  if (!pose) return { tracking: false, elbow: null, body: null, torsoTilt: null };

  const elbow = meanDefined([elbowAngle(pose, 'left', opts), elbowAngle(pose, 'right', opts)]);
  const body = meanDefined([bodyAngle(pose, 'left', opts), bodyAngle(pose, 'right', opts)]);
  const torsoTilt = torsoTiltFromHorizontal(pose, opts.aspect);

  return { tracking: elbow !== null, elbow, body, torsoTilt };
}

function createPushupAnalyzer(options = {}) {
  const opts = { ...DEFAULTS, ...options };

  const engine = createRepEngine(opts, [
    {
      // Reported on every rep, but only refuses one when asked to: see
      // requireStraightBody for why the measurement cannot be trusted with a
      // veto by default.
      read: (frame) => frame.body,
      keep: 'min',
      fails: (body) => body < opts.straightBodyMinAngle,
      issue: ISSUES.BODY_SAG,
      veto: opts.requireStraightBody,
    },
    {
      // Not being in a push-up position at all. The rep's most horizontal
      // frame decides (see maxTorsoTilt), not its worst.
      read: (frame) => frame.torsoTilt,
      keep: 'min',
      fails: (tilt) => tilt > opts.maxTorsoTilt,
      issue: ISSUES.NOT_HORIZONTAL,
      veto: true,
    },
  ]);

  return poseAnalyzer('pushup', engine, (pose) => measureFrame(pose, opts), 'elbow');
}



/**
 * Counts squats from a stream of pose frames.
 *
 * The obvious signal, the hip-knee-ankle angle, only works side-on. A camera
 * facing the person sees the knee bend almost entirely in depth: the thigh
 * swings toward the lens, and on the flat image the leg stays a straight line
 * from hip to ankle all the way down. The same projection problem that made
 * fixed push-up thresholds fail, only total — a front-on squat would read
 * 170 degrees at the bottom.
 *
 * What survives the projection is height. Turning the body, or the camera,
 * about the vertical axis moves joints sideways and in depth, never up or
 * down. The signal is how high the hip sits above the ankle, as a share of
 * its height standing: 1 standing, about 0.4 with the thighs level. The
 * signal turns that back into an angle on the knee's own scale — 180
 * standing, about 90 at parallel — so it behaves like the push-up's elbow and
 * the thresholds read like knee angles.
 *
 * Hip and ankle, not the knee. A real camera is not orthographic: a joint
 * nearer the lens is drawn larger, so it moves on the image as it moves in
 * depth. The knee is the joint that travels toward a camera in front, and an
 * earlier version that measured how far the knee sat below the hip misread
 * parallel squats by 30 degrees or more depending on how high the phone stood
 * — at hip height, real parallel squats never counted, and with the phone on
 * the floor half squats did. The ankles do not move at all, and the hips
 * travel back by a fraction of the distance to the phone, so their height
 * barely changes with where the camera is.
 *
 * Standing height is the tallest the hip has stood over the calibration
 * window, per leg, so it follows the person stepping closer or further away.
 * Turning the share into an angle assumes thigh and shin of about the same
 * length, the shin tipping forward about 0.4 as far as the thigh — what a
 * bodyweight squat does. A deeper or shallower shin than that moves the
 * reading by a few degrees, far less than the band between the thresholds.
 *
 * Both legs are averaged. A squat bends both; walking and high knees bend one
 * at a time, so the average stays near standing.
 *
 * Gate: standing. The rep's most upright frame must have the torso within
 * minUprightTilt of vertical, so a plank with the knees tucked and kicked back
 * (the legs of a burpee) counts nothing.
 */

const SQUAT_DEFAULTS = {
  /** Adapt the thresholds to the observed range; see the push-up's DEFAULTS. */
  autoCalibrate: true,
  calibrationWindowMs: 20000,
  /** Movement smaller than this is not a rep, it is noise or fidgeting. */
  minRangeDeg: 25,
  rangeFraction: 0.3,
  /**
   * Absolute limits the adapted thresholds may not cross: the thighs must get
   * within 30 degrees of level, and the person must stand back up to within
   * 35 degrees of straight.
   */
  downAngleCeiling: 120,
  upAngleFloor: 145,

  /** Fallback thresholds, until a range is known (or with autoCalibrate off). */
  downAngle: 115,
  upAngle: 155,
  /**
   * A dip that got within (upAngle - partialAngle) of the down threshold but
   * never crossed it is a half squat, reported as shallow. Smaller dips are
   * just walking.
   */
  partialAngle: 130,
  minVisibility: 0.4,
  minPhaseMs: 150,
  minRepMs: 500,
  /** The torso must be at least this many degrees off horizontal at some point in the rep. */
  minUprightTilt: 55,
  /** Frame aspect ratio (width / height) for angle correction. */
  aspect: 1,
};

const SQUAT_LEGS = {
  left: ['leftHip', 'leftKnee', 'leftAnkle'],
  right: ['rightHip', 'rightKnee', 'rightAnkle'],
};

/**
 * The hip's height above the ankle, as a share of standing, at a given thigh
 * angle from vertical: thigh and shin taken as equal halves of it, the shin
 * tipping forward SHIN_FOLLOW as far as the thigh.
 */
const SHIN_FOLLOW = 0.4;
function heightShareAt(thighDeg) {
  const r = (thighDeg * Math.PI) / 180;
  return 0.5 * Math.cos(r) + 0.5 * Math.cos(SHIN_FOLLOW * r);
}

/** The deepest thigh angle the signal reports, well past any real squat. */
const DEEPEST_THIGH = 150;

/** Thigh angle from vertical for a height share: the inverse of heightShareAt. */
function thighFromShare(share) {
  if (share >= 1) return 0;
  if (share <= heightShareAt(DEEPEST_THIGH)) return DEEPEST_THIGH;
  // heightShareAt falls steadily over 0..DEEPEST_THIGH, so bisection is exact
  // enough after a couple of dozen halvings.
  let lo = 0;
  let hi = DEEPEST_THIGH;
  for (let i = 0; i < 24; i++) {
    const mid = (lo + hi) / 2;
    if (heightShareAt(mid) > share) lo = mid;
    else hi = mid;
  }
  return (lo + hi) / 2;
}

/**
 * One leg as drawn: how high the hip sits above the ankle (image y grows
 * downward), and the leg's drawn length, which is its true length side-on.
 */
function legOf(pose, side, opts) {
  const joints = SQUAT_LEGS[side];
  if (!allVisible(pose, joints, opts.minVisibility)) return null;
  const [hip, knee, ankle] = joints.map((j) => pose[j]);
  return {
    height: ankle.y - hip.y,
    length: distance(hip, knee, opts.aspect) + distance(knee, ankle, opts.aspect),
  };
}

/** One leg's knee angle, estimated from the hip's height against `standing`. */
function squatKneeAngle(leg, standing) {
  if (!leg) return null;
  // Without a standing height yet, the leg's own drawn length: exact side-on,
  // and a stateless reading of a single frame needs something.
  const reference = Math.max(standing || leg.length, leg.height);
  if (!(reference > 0)) return null;
  return 180 - thighFromShare(leg.height / reference);
}

/**
 * Measure one frame. `standing` is each leg's hip height standing,
 * { left, right }, as the analyser tracks it; left out, the frame is read on
 * its own, which is only right side-on.
 */
function measureSquatFrame(pose, options = {}, standing = null) {
  const opts = { ...SQUAT_DEFAULTS, ...options };
  if (!pose) return { tracking: false, knee: null, torsoTilt: null, hipHeight: null };

  const left = legOf(pose, 'left', opts);
  const right = legOf(pose, 'right', opts);
  const knee = meanDefined([
    squatKneeAngle(left, standing && standing.left),
    squatKneeAngle(right, standing && standing.right),
  ]);
  const torsoTilt = tiltFromHorizontal(
    seenMidpoint(pose, 'leftShoulder', 'rightShoulder', opts.minVisibility),
    seenMidpoint(pose, 'leftHip', 'rightHip', opts.minVisibility),
    opts.aspect,
  );

  return {
    tracking: knee !== null,
    knee,
    torsoTilt,
    hipHeight: { left: left ? left.height : null, right: right ? right.height : null },
  };
}

/**
 * The largest value pushed over the last `windowMs`: a queue kept falling
 * from front to back, so each frame costs next to nothing.
 */
function windowMax(windowMs) {
  let queue = [];
  return {
    max(t) {
      while (queue.length && queue[0].t < t - windowMs) queue.shift();
      return queue.length ? queue[0].value : null;
    },
    push(value, t) {
      if (!Number.isFinite(value)) return;
      while (queue.length && queue[queue.length - 1].value <= value) queue.pop();
      queue.push({ t, value });
    },
    reset() {
      queue = [];
    },
  };
}

function createSquatAnalyzer(options = {}) {
  const opts = { ...SQUAT_DEFAULTS, ...options };

  const engine = createRepEngine(opts, [
    {
      // Judged on the rep's most upright frame: the torso leans forward at
      // the bottom of any squat, and one bad inference must not cost a rep.
      // A torso out of frame passes: a phone propped low often cuts off the
      // shoulders, and unknown is not wrong.
      read: (frame) => frame.torsoTilt,
      keep: 'max',
      fails: (tilt) => tilt < opts.minUprightTilt,
      issue: ISSUES.NOT_UPRIGHT,
      veto: true,
    },
  ]);

  const standing = { left: windowMax(opts.calibrationWindowMs), right: windowMax(opts.calibrationWindowMs) };
  const measure = (pose, timestamp) => {
    const frame = measureSquatFrame(pose, opts, {
      left: standing.left.max(timestamp),
      right: standing.right.max(timestamp),
    });
    if (frame.hipHeight) {
      standing.left.push(frame.hipHeight.left, timestamp);
      standing.right.push(frame.hipHeight.right, timestamp);
    }
    return frame;
  };
  const reset = () => {
    standing.left.reset();
    standing.right.reset();
  };

  return poseAnalyzer('squat', engine, measure, 'knee', reset);
}



/**
 * Counts sit-ups from a stream of pose frames, filmed from the side.
 *
 * The signal is the trunk angle: the angle at the hip between the torso and
 * the floor on the feet's side. Lying flat it is 180, sitting upright 90, chest
 * to the knees about 60, so it falls with the effort like the push-up's elbow.
 *
 * It is the hip angle (shoulder-hip-knee) with the thigh replaced by the
 * floor, deliberately. The real hip angle mixes two things: how far the torso
 * came up, and how sharply the knees are bent — feet a little closer to the
 * seat and a crunch reads like a full sit-up. Measuring against the floor
 * leaves only the first, which is what "came up high enough" means. Which way
 * the floor runs is read off the ankles, so the side the person lies on, or a
 * mirrored preview, changes nothing.
 *
 * Gate: lying. A rep must start from lying on the back — torso and legs both
 * near the floor in the rest before it. Judged on that rest, not on the rep:
 * a rep always ends lying back, so its own frames would pass a person who
 * stood, sat down and lay back. Standing, bowing, or sitting on a chair, the
 * legs are never flat, so none of it counts.
 */

const SITUP_DEFAULTS = {
  /** Adapt the thresholds to the observed range; see the push-up's DEFAULTS. */
  autoCalibrate: true,
  calibrationWindowMs: 20000,
  /** Movement smaller than this is not a rep, it is noise or fidgeting. */
  minRangeDeg: 25,
  rangeFraction: 0.3,
  /**
   * Absolute limits the adapted thresholds may not cross: the torso must come
   * at least 55 degrees off the floor, and go back down to within 35 of it.
   */
  downAngleCeiling: 125,
  upAngleFloor: 145,

  /** Fallback thresholds, until a range is known (or with autoCalibrate off). */
  downAngle: 120,
  upAngle: 155,
  /**
   * A dip that got within (upAngle - partialAngle) of the down threshold but
   * never crossed it is a crunch, reported as shallow. The band is wider than
   * a push-up's: lifting the shoulders 30 degrees is an attempt, not noise.
   */
  partialAngle: 125,
  minVisibility: 0.4,
  minPhaseMs: 150,
  minRepMs: 500,
  /**
   * Torso and legs (hip to ankle) must both be within this many degrees of
   * horizontal at some point in the rest before a rep. At least
   * 180 - upAngleFloor, or a rest the thresholds accept could fail the gate.
   */
  maxLyingTilt: 40,
  /** Frame aspect ratio (width / height) for angle correction. */
  aspect: 1,
};

/** Measure one frame without any state. */
function measureSitupFrame(pose, options = {}) {
  const opts = { ...SITUP_DEFAULTS, ...options };
  const none = { tracking: false, trunk: null, torsoTilt: null, legTilt: null };
  if (!pose) return none;

  const shoulder = seenMidpoint(pose, 'leftShoulder', 'rightShoulder', opts.minVisibility);
  const hip = seenMidpoint(pose, 'leftHip', 'rightHip', opts.minVisibility);
  const ankle = seenMidpoint(pose, 'leftAnkle', 'rightAnkle', opts.minVisibility);
  if (!shoulder || !hip || !ankle) return none;

  const torsoTilt = tiltFromHorizontal(hip, shoulder, opts.aspect);
  const legTilt = tiltFromHorizontal(hip, ankle, opts.aspect);

  // A point on the floor line, from the hip toward the feet.
  const towardFeet = Math.sign(ankle.x - hip.x);
  const trunk =
    towardFeet === 0 ? null : angleAt(shoulder, hip, { x: hip.x + towardFeet, y: hip.y }, opts.aspect);

  return { tracking: trunk !== null, trunk, torsoTilt, legTilt };
}

function createSitupAnalyzer(options = {}) {
  const opts = { ...SITUP_DEFAULTS, ...options };

  const engine = createRepEngine(opts, [
    {
      // How far from flat the steeper of torso and legs is; the flattest
      // frame of the rest decides, so one bad inference cannot cost a rep.
      read: (frame) =>
        Number.isFinite(frame.torsoTilt) && Number.isFinite(frame.legTilt)
          ? Math.max(frame.torsoTilt, frame.legTilt)
          : null,
      keep: 'min',
      fails: (tilt) => tilt > opts.maxLyingTilt,
      issue: ISSUES.NOT_LYING,
      veto: true,
      window: 'leadIn',
    },
  ]);

  return poseAnalyzer('situp', engine, (pose) => measureSitupFrame(pose, opts), 'trunk');
}



/**
 * Counts jumping jacks from a stream of pose frames, filmed from the front.
 *
 * The signal is the arm gap: how many degrees the upper arm is short of
 * pointing straight up along the torso — about 165 hanging at the sides, 15
 * overhead. It is 180 minus the arm's raise at the shoulder (hip-shoulder-
 * elbow), so it falls with the effort like the push-up's elbow.
 *
 * The upper arm rather than the whole arm: overhead, the hands are the first
 * thing to leave the frame of a phone propped a couple of metres away, and the
 * elbows are not. It also ignores the forearm, so a hand waved from a bent
 * elbow raises nothing.
 *
 * Both arms must be seen, and the lower one is the signal. A jumping jack
 * raises both; waving one arm overhead leaves the other at the side, so the
 * signal stays at rest and nothing counts.
 *
 * Gate: standing. The rep's most upright frame must have the torso within
 * minUprightTilt of vertical, so the same arm sweep lying on the floor (a snow
 * angel) counts nothing.
 *
 * The legs are measured (legSpread) but neither gate nor veto a rep. The ankles
 * are the joints tracked worst and the first cut off by a phone propped close,
 * and a veto on an unreliable reading is how a full set of real push-ups once
 * counted zero (see requireStraightBody in ./pushupAnalyzer).
 */

const JUMPING_JACK_DEFAULTS = {
  /** Adapt the thresholds to the observed range; see the push-up's DEFAULTS. */
  autoCalibrate: true,
  calibrationWindowMs: 20000,
  /** Movement smaller than this is not a rep, it is noise or fidgeting. */
  minRangeDeg: 25,
  /**
   * Wider than the other exercises. A jack's range is huge (about 165
   * degrees), so 30% of it put the effort threshold within 52 degrees of
   * overhead, which brisk arms pass through in under 100ms. At 40% the
   * absolute limits below decide instead.
   */
  rangeFraction: 0.4,
  /**
   * Absolute limits the adapted thresholds may not cross: the arms must get
   * within 60 degrees of straight up, and come back down to just under
   * shoulder level (80 degrees from the sides). No stricter: at 10fps, where a
   * cheap phone on the CPU delegate runs, brisk jacks at two a second leave
   * the arms below 60 degrees from the sides for a single frame, and a phase
   * one frame long can never be committed, so two jacks merged into one and a
   * third of them went uncounted.
   */
  downAngleCeiling: 60,
  upAngleFloor: 100,

  /** Fallback thresholds, until a range is known (or with autoCalibrate off). */
  downAngle: 50,
  upAngle: 130,
  /**
   * A dip that got within (upAngle - partialAngle) of the down threshold but
   * never crossed it is a jack with the arms only to shoulder height, reported
   * as shallow. Arms swinging while walking stay well clear of it.
   */
  partialAngle: 85,
  minVisibility: 0.4,
  /**
   * Shorter than the other exercises: at a brisk two a second the arms spend
   * under 200ms past either threshold, and a phone on the CPU delegate sees
   * that as two or three frames; 150, or even 80, dropped real reps at 15fps.
   * Still three frames in a row at 30fps (two at 15), so a single bad
   * inference cannot commit a phase.
   */
  minPhaseMs: 60,
  /** A brisk jumping jack takes about 0.6s; see src/exercises/exercises.js. */
  minRepMs: 350,
  /** The torso must be at least this many degrees off horizontal at some point in the rep. */
  minUprightTilt: 55,
  /** Frame aspect ratio (width / height) for angle correction. */
  aspect: 1,
};

const JACK_ARMS = {
  left: ['leftHip', 'leftShoulder', 'leftElbow'],
  right: ['rightHip', 'rightShoulder', 'rightElbow'],
};

/** Degrees one upper arm is short of straight overhead. */
function jackArmGap(pose, side, opts) {
  const joints = JACK_ARMS[side];
  if (!allVisible(pose, joints, opts.minVisibility)) return null;
  const [hip, shoulder, elbow] = joints.map((j) => pose[j]);
  const raise = angleAt(hip, shoulder, elbow, opts.aspect);
  return raise === null ? null : 180 - raise;
}

/** Measure one frame without any state. */
function measureJumpingJackFrame(pose, options = {}) {
  const opts = { ...JUMPING_JACK_DEFAULTS, ...options };
  if (!pose) return { tracking: false, armGap: null, torsoTilt: null, legSpread: null };

  const left = jackArmGap(pose, 'left', opts);
  const right = jackArmGap(pose, 'right', opts);
  const armGap = left !== null && right !== null ? Math.max(left, right) : null;

  const shoulder = seenMidpoint(pose, 'leftShoulder', 'rightShoulder', opts.minVisibility);
  const hip = seenMidpoint(pose, 'leftHip', 'rightHip', opts.minVisibility);
  const torsoTilt = tiltFromHorizontal(shoulder, hip, opts.aspect);

  // Feet apart, in torso lengths: about 0.5 together, 1.5 or more out.
  let legSpread = null;
  if (shoulder && hip && allVisible(pose, ['leftAnkle', 'rightAnkle'], opts.minVisibility)) {
    const torso = distance(shoulder, hip, opts.aspect);
    if (torso > 0) legSpread = distance(pose.leftAnkle, pose.rightAnkle, opts.aspect) / torso;
  }

  return { tracking: armGap !== null, armGap, torsoTilt, legSpread };
}

function createJumpingJackAnalyzer(options = {}) {
  const opts = { ...JUMPING_JACK_DEFAULTS, ...options };

  const engine = createRepEngine(opts, [
    {
      // Judged on the rep's most upright frame, like the squat's.
      read: (frame) => frame.torsoTilt,
      keep: 'max',
      fails: (tilt) => tilt < opts.minUprightTilt,
      issue: ISSUES.NOT_UPRIGHT,
      veto: true,
    },
  ]);

  return poseAnalyzer('jumpingjack', engine, (pose) => measureJumpingJackFrame(pose, opts), 'armGap');
}






/**
 * One way in to every pose analyser: pick by exercise id.
 *
 * The ids are the ones in src/exercises/exercises.js. This file does not import
 * that table: the generated pose page inlines everything under src/pose/ and
 * nothing else, and needs only the ids. scripts/verify-pose.mjs checks the two
 * lists agree.
 *
 * Every analyser has the same contract — `reps` and `phase` getters, `reset()`,
 * `push(pose, timestamp)` returning { reps, phase, repCompleted, partialRep,
 * issues, tracking, thresholds, signal, ...its own readings } — so the stages
 * and the page never branch on the exercise to count it.
 */

/** Issue ids every analyser reports in (see ./repEngine for what each means). */

const POSE_EXERCISE_IDS = ['pushup', 'squat', 'situp', 'jumpingjack'];

const POSE_FACTORIES = {
  pushup: createPushupAnalyzer,
  squat: createSquatAnalyzer,
  situp: createSitupAnalyzer,
  jumpingjack: createJumpingJackAnalyzer,
};

/** Each analyser's default options, for showing its thresholds (the page's debug HUD). */
const POSE_DEFAULTS = {
  pushup: DEFAULTS,
  squat: SQUAT_DEFAULTS,
  situp: SITUP_DEFAULTS,
  jumpingjack: JUMPING_JACK_DEFAULTS,
};

/** The exercise an analyser will actually count for this id: unknown or missing is a push-up. */
function poseExerciseId(exerciseId) {
  return POSE_EXERCISE_IDS.includes(exerciseId) ? exerciseId : 'pushup';
}

/**
 * A fresh analyser for this exercise; unknown or missing ids get the push-up
 * one, as everywhere else in the app.
 * @param {string} exerciseId
 * @param {object} [options]  overrides for that analyser's defaults (aspect, ...)
 */
function createAnalyzer(exerciseId, options) {
  return POSE_FACTORIES[poseExerciseId(exerciseId)](options);
}


/* ------------------------------------------------------------------------
 * Page: camera, MediaPipe, skeleton overlay, and the bridge to React Native.
 * --------------------------------------------------------------------- */

/**
 * Which exercise to count, from ?exercise=<id>; anything unknown is a
 * push-up, as everywhere else. The ready message reports the id actually
 * counted, so the app can tell this page from an older one that only counts
 * push-ups and ignores the parameter.
 */
const PAGE_EXERCISE = poseExerciseId(new URLSearchParams(location.search).get('exercise'));
const PAGE_OPTS = POSE_DEFAULTS[PAGE_EXERCISE];
const PAGE_PROTOCOL_VERSION = 2;

const MEDIAPIPE_VERSION = '1.0.1';
const CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MEDIAPIPE_VERSION;
const MODEL_URL =
  'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

const TARGET_FPS = 30;
const FRAME_INTERVAL_MS = Math.round(1000 / TARGET_FPS);
const STALE_FRAME_MS = 250;
const DRAW_MIN_SCORE = 0.4;
const MAX_CONSECUTIVE_ERRORS = 30;

const ACCENT = '#4ADE80';
const FAINT = '#55555E';

const videoEl = document.getElementById('video');
const canvasEl = document.getElementById('overlay');
const statusEl = document.getElementById('status');

let analyzer = null;
let landmarker = null;
let timer = null;
let stream = null;
let paused = false;
let wakeLock = null;
let delegateUsed = null;
let lastVideoTime = -1;
let lastInferenceAt = 0;
let consecutiveErrors = 0;

/** Post a message to the React Native host (no-op in a plain browser). */
function send(payload) {
  try {
    window.ReactNativeWebView?.postMessage(JSON.stringify(payload));
  } catch (e) {
    /* standalone browser */
  }
}

/**
 * Hold the screen awake.
 *
 * Working out means not touching the phone, so the display sleeps on its
 * usual ~30s timeout and takes the camera with it — the page looks like it
 * "switched itself off" moments after the model finished loading. The app has
 * expo-keep-awake for this; the page needs its own.
 *
 * The lock is released automatically whenever the page is hidden, so it has to
 * be taken again every time we become visible, not just once at startup.
 */
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => {
      wakeLock = null;
      updateSysLine();
    });
  } catch (e) {
    wakeLock = null; // denied, or not allowed in this context
  }
  updateSysLine();
}

/**
 * Coming back from a hidden state: the wake lock is gone, the video element is
 * usually paused, and the interval may have been throttled to a standstill.
 * Restore all three rather than leaving a frozen preview on screen.
 */
async function handleVisible() {
  if (document.visibilityState !== 'visible') return;
  acquireWakeLock();
  try {
    if (videoEl.srcObject && videoEl.paused) await videoEl.play();
  } catch (e) {
    /* autoplay policy — the track listener below reports a dead camera */
  }
  if (landmarker && analyzer && !timer) {
    timer = setInterval(tick, FRAME_INTERVAL_MS);
  }
}

/** Report a camera that has stopped for good, instead of showing black. */
function watchStream(mediaStream) {
  mediaStream.getVideoTracks().forEach((track) => {
    track.addEventListener('ended', () => {
      setStatus('The camera stopped. Tap here to restart.', true);
      statusEl.onclick = () => {
        statusEl.onclick = null;
        location.reload();
      };
      send({ type: 'status', phase: 'error', message: 'camera track ended' });
    });
  });
}

/**
 * @param {string|null} text     message, or null to hide
 * @param {boolean} isError      render in the error colour
 * @param {boolean} compact      banner across the top instead of a full cover,
 *                               for when the camera behind it should stay visible
 */
function setStatus(text, isError, compact) {
  if (!text) {
    statusEl.classList.add('hidden');
    return;
  }
  statusEl.textContent = text;
  statusEl.classList.remove('hidden');
  statusEl.classList.toggle('error', !!isError);
  statusEl.classList.toggle('compact', !!compact);
}

function draw(pose, tracking) {
  const width = videoEl.videoWidth;
  const height = videoEl.videoHeight;
  if (!width || !height) return;
  if (canvasEl.width !== width || canvasEl.height !== height) {
    canvasEl.width = width;
    canvasEl.height = height;
  }

  const ctx = canvasEl.getContext('2d');
  ctx.clearRect(0, 0, width, height);
  if (!pose) return;

  const at = (joint) => {
    const p = pose[joint];
    if (!p || p.score < DRAW_MIN_SCORE) return null;
    return { x: p.x * width, y: p.y * height };
  };

  const colour = tracking ? ACCENT : FAINT;
  ctx.strokeStyle = colour;
  ctx.fillStyle = colour;
  ctx.lineWidth = Math.max(2, width / 180);
  ctx.lineCap = 'round';

  for (const bone of SKELETON_BONES) {
    const a = at(bone[0]);
    const b = at(bone[1]);
    if (!a || !b) continue;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  for (const joint of Object.keys(pose)) {
    const p = at(joint);
    if (!p) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(3, width / 240), 0, Math.PI * 2);
    ctx.fill();
  }
}

/* --- diagnostic HUD ---------------------------------------------------- */

/**
 * Shown when the page is opened directly in a browser, or with ?debug=1.
 * Inside the app the WebView is covered by the app's own counter, so the HUD
 * would only be in the way. Opening the URL in a phone browser is therefore
 * the way to see what the model actually reads while training.
 */
const hudEl = document.getElementById('hud');
const hudReps = document.getElementById('hudReps');
const hudPhase = document.getElementById('hudPhase');
const hudIssue = document.getElementById('hudIssue');
const hudSignal = document.getElementById('hudSignal');
const hudSignalK = document.getElementById('hudSignalK');
const hudFps = document.getElementById('hudFps');
const hudBarFill = document.getElementById('hudBarFill');
const hudCopied = document.getElementById('hudCopied');
const hudSys = document.getElementById('hudSys');
const hudDeepest = document.getElementById('hudDeepest');
const hudDeepestK = document.getElementById('hudDeepestK');
const hudCellEls = [
  [document.getElementById('hudAK'), document.getElementById('hudA')],
  [document.getElementById('hudBK'), document.getElementById('hudB')],
];

const fmtDeg = (v) => (Number.isFinite(v) ? Math.round(v) + '°' : '—');

/**
 * What the HUD shows for each exercise: its signal under its own name, the
 * word for its best moment, and two readings its gates judge — each with the
 * test that turns it red (null: never red, just shown).
 */
const HUD_SPEC = {
  pushup: {
    signal: 'ELBOW',
    best: 'DEEPEST',
    cells: [
      ['BODY', (r) => r.body, (v) => v < PAGE_OPTS.straightBodyMinAngle, fmtDeg],
      ['TILT', (r) => r.torsoTilt, (v) => v > PAGE_OPTS.maxTorsoTilt, fmtDeg],
    ],
  },
  squat: {
    signal: 'KNEE',
    best: 'DEEPEST',
    cells: [
      ['TILT', (r) => r.torsoTilt, (v) => v < PAGE_OPTS.minUprightTilt, fmtDeg],
      ['RANGE', (r) => (r.thresholds && r.thresholds.adapted
        ? r.thresholds.observedMax - r.thresholds.observedMin : null), null, fmtDeg],
    ],
  },
  situp: {
    signal: 'TRUNK',
    best: 'HIGHEST',
    cells: [
      ['TILT', (r) => r.torsoTilt, null, fmtDeg],
      ['LEGS', (r) => r.legTilt, (v) => v > PAGE_OPTS.maxLyingTilt, fmtDeg],
    ],
  },
  jumpingjack: {
    signal: 'ARM GAP',
    best: 'HIGHEST',
    cells: [
      ['TILT', (r) => r.torsoTilt, (v) => v < PAGE_OPTS.minUprightTilt, fmtDeg],
      ['FEET', (r) => r.legSpread, null, (v) => (Number.isFinite(v) ? v.toFixed(1) + '×' : '—')],
    ],
  },
}[PAGE_EXERCISE];

hudSignalK.textContent = HUD_SPEC.signal;
HUD_SPEC.cells.forEach((cell, i) => { hudCellEls[i][0].textContent = cell[0]; });

/**
 * The best signal reached in the rep (the lowest: deepest push-up or squat,
 * highest sit-up, arms closest to overhead), against what is actually required.
 *
 * This is the one number that explains a silent failure. If a rep never gets
 * below downAngle the analyser makes no phase transition at all, so it reports
 * no issue and no rep — the screen just sits there. Seeing "118 / need 100"
 * says immediately whether the problem is depth, the camera angle flattening
 * the measurement, or a threshold that is simply wrong for this setup.
 */
let deepestSignal = Infinity;
let lastNeeded = null;
let prevPhase = null;

/** Summary of the run, kept so a closed page still has something to report. */
const SUMMARY_KEY = 'pupg:lastPoseSession';
let sessionFrames = 0;
let trackedFrames = 0;
let lastSummaryWrite = 0;

function persistSummary(reps) {
  try {
    localStorage.setItem(SUMMARY_KEY, JSON.stringify({
      when: new Date().toISOString(),
      frames: sessionFrames,
      tracked: trackedFrames,
      exercise: PAGE_EXERCISE,
      deepest: Number.isFinite(deepestSignal) ? Math.round(deepestSignal) : null,
      reps: reps,
      needed: lastNeeded == null ? PAGE_OPTS.downAngle : Math.round(lastNeeded),
      delegate: delegateUsed,
      stuckAt: coachState,
    }));
  } catch (e) {
    /* private mode */
  }
}

/** Show what happened last time, so a failed run is not lost on reload. */
function showLastSummary() {
  try {
    const raw = localStorage.getItem(SUMMARY_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s || !s.frames) return;
    // Runs saved before there was more than one exercise were push-ups.
    const best = s.deepest != null ? s.deepest : s.deepestElbow;
    const deep = best == null ? 'never tracked' : best + '° best';
    const why = s.stuckAt && s.stuckAt !== 'ready' ? ' — stuck at: ' + s.stuckAt : '';
    hudCopied.textContent =
      'Last run (' + (s.exercise || 'pushup') + '): ' + s.reps + ' reps, ' + deep +
      ' (need ' + s.needed + '°)' + why;
    setTimeout(() => { hudCopied.textContent = ''; }, 8000);
  } catch (e) {
    /* ignore */
  }
}

/**
 * Surfaces the two things that silently kill a session: the screen sleeping,
 * and which inference delegate actually loaded. Without this a phone that
 * switched itself off looks identical to one that crashed.
 */
function updateSysLine() {
  if (!hudSys) return;
  const lockOn = !!wakeLock;
  const lockSupported = 'wakeLock' in navigator;
  const lockText = !lockSupported
    ? '<span class="warn">screen lock: unsupported — set display timeout to Never</span>'
    : lockOn
      ? 'screen: staying awake'
      : '<span class="warn">screen: may sleep</span>';
  const fps = fpsWindow.length ? fpsWindow.length + 'fps' : '—';
  const tracked = sessionFrames
    ? Math.round((trackedFrames / sessionFrames) * 100) + '% tracked'
    : 'no frames';
  hudSys.innerHTML = PAGE_EXERCISE + ' &middot; ' +
    lockText + ' &middot; ' + (delegateUsed || '—') + ' &middot; ' + fps + ' &middot; ' + tracked;
}

let hudEnabled = false;
let fpsWindow = [];

/**
 * Coaching messages must outlive the frame that produced them.
 *
 * The analyser reports "shallow" or "bodySag" only on the frame where the rep
 * finishes, so showing issues raw would flash the advice for one frame (~33ms)
 * and clear it — unreadable. Hold the last message briefly instead, and drop it
 * the moment a rep counts, since that is the answer to it.
 */
const ISSUE_STICKY_MS = 2200;
let stickyIssue = null;
let stickyIssueAt = 0;
/** Angle trace, so a real set can be sent back and thresholds tuned on data. */
const trace = [];
const TRACE_LIMIT = 6000;

/** What each issue asks for, with the exercises that word one their own way. */
const ISSUE_TEXT = Object.assign(
  {
    lostTracking: 'Step into frame',
    notHorizontal: 'Get into push-up position',
    bodySag: 'Keep your body straight',
    shallow: 'Go lower',
    notUpright: 'Stand up straight',
    notLying: 'Lie on your back to start',
  },
  {
    situp: { shallow: 'Come up higher' },
    jumpingjack: { shallow: 'Arms all the way up' },
  }[PAGE_EXERCISE],
);

const coachEl = document.getElementById('coach');
const coachTitleEl = document.getElementById('coachTitle');
const coachBodyEl = document.getElementById('coachBody');

const NO_POSE_HELP = ['No one in frame',
  'Prop the phone so your whole body is visible, about 2m away, and make sure the room is lit.'];

/** Per exercise: the joints that must be in frame, and the position it starts from. */
const SETUP_HELP = {
  pushup: {
    outOfFrame: ['Arms out of frame',
      'Your shoulder, elbow and wrist all have to be visible. Move the phone back or turn it sideways.'],
    position: ['Get into a push-up position',
      'Lie face down with your body roughly level. Standing in front of the camera will not count.'],
    calibrating: ['Learning your range',
      'Do one full push-up — all the way down, all the way up — and counting starts.'],
  },
  squat: {
    outOfFrame: ['Legs out of frame',
      'Hips, knees and ankles all have to be visible. Move the phone back, or lower it to about knee height.'],
    position: ['Stand up straight',
      'Squats count from standing. Face the camera or stand side-on, either works.'],
    calibrating: ['Learning your range',
      'Do one full squat — thighs down to level, then all the way up — and counting starts.'],
  },
  situp: {
    outOfFrame: ['Body out of frame',
      'Shoulders, hips and ankles all have to be visible. Put the phone at your side, about 2m away.'],
    position: ['Lie on your back',
      'Knees bent, feet on the floor, side-on to the camera. Sitting on a chair or standing will not count.'],
    calibrating: ['Learning your range',
      'Do one full sit-up — all the way up, all the way back down — and counting starts.'],
  },
  jumpingjack: {
    outOfFrame: ['Arms out of frame',
      'Both shoulders and elbows have to stay visible, overhead too. Step back from the phone.'],
    position: ['Stand up straight',
      'Face the camera, arms at your sides. Lying on the floor will not count.'],
    calibrating: ['Learning your range',
      'Do one full jumping jack — arms all the way overhead, then back to your sides — and counting starts.'],
  },
}[PAGE_EXERCISE];

/**
 * What each exercise needs to see (`seen` tests one joint), and whether this
 * frame shows the wrong starting position for it.
 */
const SETUP_CHECKS = {
  pushup: {
    inFrame: (seen) => ['left', 'right'].some((side) =>
      seen(side + 'Shoulder') && seen(side + 'Elbow') && seen(side + 'Wrist')),
    misplaced: (r) => Number.isFinite(r.torsoTilt) && r.torsoTilt > PAGE_OPTS.maxTorsoTilt,
  },
  squat: {
    inFrame: (seen) => ['left', 'right'].some((side) =>
      seen(side + 'Hip') && seen(side + 'Knee') && seen(side + 'Ankle')),
    misplaced: (r) => Number.isFinite(r.torsoTilt) && r.torsoTilt < PAGE_OPTS.minUprightTilt,
  },
  situp: {
    inFrame: (seen) => ['Shoulder', 'Hip', 'Ankle'].every((joint) =>
      seen('left' + joint) || seen('right' + joint)),
    // The legs stay on the floor all through a sit-up, so they can be judged
    // on any frame without nagging mid-rep.
    misplaced: (r) => Number.isFinite(r.legTilt) && r.legTilt > PAGE_OPTS.maxLyingTilt,
  },
  jumpingjack: {
    inFrame: (seen) => ['left', 'right'].every((side) =>
      seen(side + 'Hip') && seen(side + 'Shoulder') && seen(side + 'Elbow')),
    misplaced: (r) => Number.isFinite(r.torsoTilt) && r.torsoTilt < PAGE_OPTS.minUprightTilt,
  },
}[PAGE_EXERCISE];

let coachState = null;
let coachSince = 0;

/**
 * Work out which of the four silent failures is happening — no one in frame,
 * the joints this exercise needs out of frame, the wrong starting position, or
 * still learning the range — rather than leaving the screen at zero with no
 * explanation.
 */
function setupState(pose, result) {
  if (!pose) return 'noPose';
  const seen = (j) => pose[j] && pose[j].score >= PAGE_OPTS.minVisibility;
  if (!SETUP_CHECKS.inFrame(seen)) return 'outOfFrame';
  if (SETUP_CHECKS.misplaced(result)) return 'position';
  if (result.thresholds && !result.thresholds.adapted) return 'calibrating';
  return 'ready';
}

/** Debounced so a single dropped frame does not flash a setup warning. */
function updateCoach(pose, result, now) {
  if (!hudEnabled) return;
  const state = setupState(pose, result);

  if (state !== coachState) {
    coachState = state;
    coachSince = now;
  }
  const settled = now - coachSince > 700;

  if (state === 'ready' || !settled) {
    if (state === 'ready') coachEl.classList.add('hidden');
    return;
  }

  const help = state === 'noPose' ? NO_POSE_HELP : SETUP_HELP[state];
  if (!help) {
    coachEl.classList.add('hidden');
    return;
  }
  coachTitleEl.textContent = help[0];
  coachBodyEl.textContent = help[1];
  coachEl.classList.toggle('good', state === 'calibrating');
  coachEl.classList.remove('hidden');
}

function updateHud(result) {
  if (!hudEnabled) return;

  const now = performance.now();
  fpsWindow.push(now);
  while (fpsWindow.length && now - fpsWindow[0] > 1000) fpsWindow.shift();

  // Every analyser reports its signal under the same name, whatever it is
  // measuring; an untracked frame has none.
  const signal = result.signal;

  sessionFrames += 1;
  if (Number.isFinite(signal)) {
    trackedFrames += 1;
    deepestSignal = Math.min(deepestSignal, signal);
  }
  // Reset at the start of an effort, not when a rep completes: resetting on
  // completion immediately replaced a good depth with the angle of someone
  // back at rest, which then rendered red and read as a failure. Held this
  // way, the cell shows the best of the rep just finished until the next one
  // begins.
  if (result.phase === 'down' && prevPhase !== 'down') deepestSignal = Infinity;
  prevPhase = result.phase;

  hudReps.textContent = result.reps != null ? result.reps : 0;
  hudPhase.textContent = (result.phase || 'unknown').toUpperCase();
  hudPhase.className = result.phase === 'down' ? 'down' : result.phase === 'up' ? 'up' : '';
  hudSignal.textContent = fmtDeg(signal);

  // The targets are whatever the analyser is currently using, which adapt to
  // the range this person actually moves through.
  const needed = result.thresholds ? result.thresholds.down : PAGE_OPTS.downAngle;
  const restAt = result.thresholds ? result.thresholds.up : PAGE_OPTS.upAngle;
  hudDeepest.textContent = fmtDeg(deepestSignal);
  hudDeepestK.textContent =
    HUD_SPEC.best + ' / ' + Math.round(needed) + '°' +
    (result.thresholds && result.thresholds.adapted ? ' AUTO' : '');
  hudDeepest.className =
    'v' + (Number.isFinite(deepestSignal) ? (deepestSignal <= needed ? ' ok' : ' bad') : '');
  lastNeeded = needed;

  if (now - lastSummaryWrite > 2000) {
    lastSummaryWrite = now;
    persistSummary(result.reps || 0);
    updateSysLine(); // refresh fps and tracked-percentage
  }

  hudSignal.className = 'v' + (Number.isFinite(signal) ? (signal <= needed ? ' ok' : '') : ' bad');
  HUD_SPEC.cells.forEach((cell, i) => {
    const value = cell[1](result);
    hudCellEls[i][1].textContent = cell[3](value);
    hudCellEls[i][1].className = 'v' + (Number.isFinite(value) && cell[2]
      ? (cell[2](value) ? ' bad' : ' ok') : '');
  });

  const issue = (result.issues || [])[0];
  if (result.repCompleted) {
    stickyIssue = null;
  } else if (issue) {
    stickyIssue = ISSUE_TEXT[issue] || issue;
    stickyIssueAt = now;
  } else if (stickyIssue && now - stickyIssueAt > ISSUE_STICKY_MS) {
    stickyIssue = null;
  }
  hudIssue.textContent = stickyIssue || '';

  // Effort bar: full at the effort threshold, empty back at rest.
  if (Number.isFinite(signal)) {
    const span = Math.max(1, restAt - needed);
    const pct = Math.max(0, Math.min(1, (restAt - signal) / span)) * 100;
    hudBarFill.style.width = pct.toFixed(0) + '%';
    hudBarFill.style.background = pct >= 100 ? '#4ADE80' : '#FBBF24';
  }

  if (trace.length < TRACE_LIMIT) {
    const row = {
      t: Math.round(now),
      signal: Number.isFinite(signal) ? +signal.toFixed(1) : null,
      phase: result.phase,
      reps: result.reps,
      rep: !!result.repCompleted,
      issues: result.issues && result.issues.length ? result.issues : undefined,
    };
    HUD_SPEC.cells.forEach((cell) => {
      const value = cell[1](result);
      row[cell[0].toLowerCase()] = Number.isFinite(value) ? +value.toFixed(2) : null;
    });
    trace.push(row);
  }
}

document.getElementById('hudReset').addEventListener('click', () => {
  if (analyzer) analyzer.reset();
  trace.length = 0;
  deepestSignal = Infinity;
  sessionFrames = 0;
  trackedFrames = 0;
  hudCopied.textContent = 'reset';
  setTimeout(() => { hudCopied.textContent = ''; }, 1200);
});

document.getElementById('hudCopy').addEventListener('click', async () => {
  const counted = trace.filter((r) => r.rep).length;
  const signals = trace.map((r) => r.signal).filter((v) => v != null);
  const payload = {
    exercise: PAGE_EXERCISE,
    signal: HUD_SPEC.signal,
    thresholds: PAGE_OPTS,
    summary: {
      frames: trace.length,
      countedReps: counted,
      minSignal: signals.length ? Math.min.apply(null, signals) : null,
      maxSignal: signals.length ? Math.max.apply(null, signals) : null,
      trackedFrames: signals.length,
    },
    trace: trace,
  };
  const text = JSON.stringify(payload);
  try {
    await navigator.clipboard.writeText(text);
    hudCopied.textContent = 'Copied ' + trace.length + ' frames, ' + counted + ' reps';
  } catch (e) {
    // Clipboard needs a user gesture and permission; fall back to selectable text.
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;bottom:0;left:0;width:100%;height:120px;z-index:99';
    document.body.appendChild(ta);
    ta.select();
    hudCopied.textContent = 'Select the text below and copy it';
  }
  setTimeout(() => { hudCopied.textContent = ''; }, 4000);
});

function tick() {
  if (!landmarker || !analyzer || videoEl.readyState < 2) return;

  const now = performance.now();
  const isNewFrame = videoEl.currentTime !== lastVideoTime;
  const isStale = now - lastInferenceAt >= STALE_FRAME_MS;
  if (!isNewFrame && !isStale) return;

  lastVideoTime = videoEl.currentTime;
  lastInferenceAt = now;

  try {
    const detection = landmarker.detectForVideo(videoEl, now);
    const raw = detection && detection.landmarks && detection.landmarks[0];
    const pose = raw ? fromMediaPipe(raw) : null;

    if (paused) {
      draw(pose, !!pose);
    } else {
      const result = pose
        ? analyzer.push(pose, now)
        : { tracking: false, issues: [ISSUES.LOST_TRACKING], reps: analyzer.reps };

      if (result.repCompleted) {
        send({ type: 'rep', reps: result.reps, elbow: result.elbow });
      }
      send({
        type: 'frame',
        tracking: !!result.tracking,
        phase: result.phase,
        issues: result.issues || [],
        reps: result.reps,
      });
      updateHud(result);
      updateCoach(pose, result, now);
      draw(pose, result.tracking);
    }
    consecutiveErrors = 0;
  } catch (e) {
    consecutiveErrors += 1;
    if (consecutiveErrors === MAX_CONSECUTIVE_ERRORS) {
      setStatus('Pose detection keeps failing: ' + (e && e.message ? e.message : e), true);
      send({ type: 'status', phase: 'error', message: String(e && e.message ? e.message : e) });
    }
  }
}

async function start() {
  try {
    setStatus('Starting camera…');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error(
        'This page must be served over HTTPS for camera access (getUserMedia is unavailable).',
      );
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false,
    });
    videoEl.srcObject = stream;
    watchStream(stream);
    await videoEl.play();
    await acquireWakeLock();

    // The camera is live from here on, so uncover it: the model download takes
    // a few seconds and that is exactly when someone wants to see the frame to
    // position the phone. Tell the app host too, so it can do the same.
    send({ type: 'status', phase: 'camera' });
    setStatus('Loading model… you can frame yourself now', false, true);
    const vision = await import(CDN + '/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks(CDN + '/wasm');

    // The GPU delegate is faster but fails or crashes outright on a fair
    // number of Android GPUs. Falling back to CPU costs frames; not falling
    // back costs the whole feature.
    const makeLandmarker = (delegate) =>
      vision.PoseLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: delegate },
        runningMode: 'VIDEO',
        numPoses: 1,
      });

    try {
      landmarker = await makeLandmarker('GPU');
      delegateUsed = 'GPU';
    } catch (gpuError) {
      setStatus('GPU unavailable, loading on CPU…', false, true);
      landmarker = await makeLandmarker('CPU');
      delegateUsed = 'CPU';
    }

    analyzer = createAnalyzer(PAGE_EXERCISE, {
      aspect: (videoEl.videoWidth || 640) / (videoEl.videoHeight || 480),
    });

    setStatus(null);
    // `exercise` is what this page counts, not what was asked for: the app
    // refuses to run on a page that would count the wrong thing.
    send({
      type: 'status',
      phase: 'ready',
      exercise: analyzer.exercise,
      version: PAGE_PROTOCOL_VERSION,
    });

    // Inside the app the WebView sits behind the app's own counter, so the HUD
    // would just get in the way. Opened directly in a browser it is the point.
    hudEnabled = !window.ReactNativeWebView || /[?&]debug=1/.test(location.search);
    hudEl.classList.toggle('hidden', !hudEnabled);
    updateSysLine();
    if (hudEnabled) showLastSummary();

    timer = setInterval(tick, FRAME_INTERVAL_MS);
  } catch (e) {
    const message =
      e && e.name === 'NotAllowedError'
        ? 'Camera permission denied. Allow camera access, then reload.'
        : (e && e.message) || 'Could not start the camera.';
    setStatus(message, true);
    send({ type: 'status', phase: 'error', message });
  }
}

/** Commands from the React Native host. */
function handleCommand(rawData) {
  let msg;
  try {
    msg = JSON.parse(rawData);
  } catch (e) {
    return;
  }
  if (msg.type === 'pause') paused = true;
  else if (msg.type === 'resume') paused = false;
  else if (msg.type === 'reset') analyzer && analyzer.reset();
  else if (msg.type === 'mirror') {
    videoEl.classList.toggle('mirrored', !!msg.value);
    canvasEl.classList.toggle('mirrored', !!msg.value);
  }
}

// RN delivers injected messages on window on Android and document on iOS.
window.addEventListener('message', (e) => handleCommand(e.data));
document.addEventListener('message', (e) => handleCommand(e.data));

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    // Last chance to record the run: on mobile a page is often never given a
    // real unload, so a summary written only every 2s would lose the ending.
    persistSummary(analyzer ? analyzer.reps : 0);
  } else {
    handleVisible();
  }
});

/**
 * Only tear down on a real unload. The previous version stopped every track on
 * any `pagehide`, which also fires when the page goes into the back/forward
 * cache — so returning to it restored a page whose camera had been killed for
 * good, with nothing left to restart it.
 */
window.addEventListener('pagehide', (event) => {
  persistSummary(analyzer ? analyzer.reps : 0);
  if (event.persisted) return; // bfcache: we may be coming right back
  if (timer) clearInterval(timer);
  timer = null;
  if (stream) stream.getTracks().forEach((t) => t.stop());
});

start();
</script>
</body>
</html>
