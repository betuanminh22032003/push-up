<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>PUPG pose detector</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #video, #overlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  /* Mirrored so moving left on screen matches moving left in life. */
  #video.mirrored, #overlay.mirrored { transform: scaleX(-1); }
  #overlay { pointer-events: none; }
  #status {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    background: rgba(10,10,11,0.86); color: #8A8A93;
    font-size: 14px; line-height: 1.5;
  }
  #status.hidden { display: none; }
  #status.error { color: #F87171; }
  /*
   * Once the camera is live there is something worth looking at, so the status
   * stops covering it and becomes a banner. Framing yourself is the whole job
   * of those few seconds while the model downloads.
   */
  #status.compact {
    inset: auto 0 auto 0;
    top: calc(12px + env(safe-area-inset-top));
    margin: 0 12px;
    padding: 9px 14px;
    border-radius: 999px;
    background: rgba(10,10,11,0.82);
    border: 1px solid #26262C;
    font-size: 13px;
  }

  /* Diagnostic HUD: what the model actually reads, live, while you train. */
  #hud {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: rgba(10,10,11,0.86);
    border-top: 1px solid #26262C;
    color: #F5F5F7; font-variant-numeric: tabular-nums;
  }
  #hud.hidden { display: none; }
  #hudTop { display: flex; align-items: baseline; gap: 14px; }
  #hudReps { font-size: 40px; font-weight: 700; line-height: 1; }
  #hudPhase {
    font-size: 11px; font-weight: 700; letter-spacing: 1.4px;
    padding: 3px 9px; border-radius: 999px; border: 1px solid #55555E; color: #8A8A93;
  }
  #hudPhase.down { border-color: #FBBF24; color: #FBBF24; }
  #hudPhase.up { border-color: #4ADE80; color: #4ADE80; }
  #hudIssue { margin-left: auto; font-size: 12px; color: #FBBF24; text-align: right; }
  #hudGrid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 6px; margin-top: 10px;
  }
  .cell { background: #131316; border: 1px solid #26262C; border-radius: 8px; padding: 6px 4px; text-align: center; }
  .cell .k { display: block; font-size: 9px; letter-spacing: 1px; color: #55555E; }
  .cell .v { display: block; font-size: 17px; font-weight: 600; margin-top: 2px; }
  .cell .v.ok { color: #4ADE80; }
  .cell .v.bad { color: #F87171; }
  #hudBar { height: 6px; background: #26262C; border-radius: 3px; margin-top: 10px; overflow: hidden; }
  #hudBarFill { height: 100%; width: 0%; background: #4ADE80; transition: width 80ms linear; }
  #hudActions { display: flex; gap: 8px; margin-top: 10px; }
  #hudActions button {
    flex: 1; padding: 10px; font-size: 13px; font-weight: 600;
    background: #1C1C21; color: #F5F5F7;
    border: 1px solid #26262C; border-radius: 8px;
  }
  #hudActions button:active { opacity: 0.6; }
  #hudCopied { font-size: 11px; color: #4ADE80; text-align: center; margin-top: 6px; min-height: 14px; }
  #hudSys { font-size: 10px; color: #55555E; text-align: center; letter-spacing: 0.4px; }
  #hudSys .warn { color: #FBBF24; }

  /*
   * Setup coach. "Zero reps" has four different causes that look identical on
   * screen — no person found, arms out of frame, not in a push-up position, or
   * still learning the range. Naming the actual one is the difference between
   * a user who can fix it and a user who just sees nothing happen.
   */
  #coach {
    position: absolute; left: 12px; right: 12px;
    top: 50%; transform: translateY(-50%);
    padding: 18px 20px; border-radius: 16px;
    background: rgba(10,10,11,0.88); border: 1px solid #26262C;
    text-align: center;
  }
  #coach.hidden { display: none; }
  #coach.good { border-color: #4ADE80; }
  #coachTitle { font-size: 18px; font-weight: 700; color: #F5F5F7; }
  #coachBody { font-size: 13px; color: #8A8A93; margin-top: 6px; line-height: 1.45; }
</style>
</head>
<body>
  <video id="video" class="mirrored" playsinline muted autoplay></video>
  <canvas id="overlay" class="mirrored"></canvas>
  <div id="status">Starting camera…</div>

  <div id="coach" class="hidden">
    <div id="coachTitle"></div>
    <div id="coachBody"></div>
  </div>

  <div id="hud" class="hidden">
    <div id="hudTop">
      <span id="hudReps">0</span>
      <span id="hudPhase">—</span>
      <span id="hudIssue"></span>
    </div>
    <div id="hudGrid">
      <div class="cell"><span class="k">ELBOW</span><span class="v" id="hudElbow">—</span></div>
      <div class="cell"><span class="k" id="hudDeepestK">DEEPEST</span><span class="v" id="hudDeepest">—</span></div>
      <div class="cell"><span class="k">BODY</span><span class="v" id="hudBody">—</span></div>
      <div class="cell"><span class="k">TILT</span><span class="v" id="hudTilt">—</span></div>
    </div>
    <div id="hudFps" hidden></div>
    <div id="hudBar"><div id="hudBarFill"></div></div>
    <div id="hudActions">
      <button id="hudReset" type="button">Reset</button>
      <button id="hudCopy" type="button">Copy log</button>
    </div>
    <div id="hudCopied"></div>
    <div id="hudSys"></div>
  </div>

<script>
/* ------------------------------------------------------------------------
 * Shared detection core, injected verbatim by scripts/build-pose-page.mjs
 * from src/pose/{geometry,landmarks,pushupAnalyzer}.js.
 *
 * DO NOT EDIT the injected block: edit those modules and rebuild. They are
 * the same files the Node test suite exercises, so this page and the app
 * count push-ups by identical rules.
 * --------------------------------------------------------------------- */
/**
 * Geometry helpers over normalised pose landmarks.
 *
 * Landmarks arrive normalised per axis (x and y both 0..1), which silently
 * distorts angles on any non-square frame: on a 16:9 image one unit of x is
 * 1.78x wider than one unit of y, so an arm at a true 90 degrees measures as
 * something else. Every function here takes the frame's aspect ratio
 * (width / height) and restores real proportions before measuring.
 */

/** Euclidean distance, aspect-corrected. */
function distance(a, b, aspect = 1) {
  if (!a || !b) return null;
  const dx = (a.x - b.x) * aspect;
  const dy = a.y - b.y;
  return Math.hypot(dx, dy);
}

/**
 * Interior angle at vertex `b`, in degrees (0..180), between rays b->a and b->c.
 * Returns null if any point is missing or two points coincide.
 */
function angleAt(a, b, c, aspect = 1) {
  if (!a || !b || !c) return null;

  const abx = (a.x - b.x) * aspect;
  const aby = a.y - b.y;
  const cbx = (c.x - b.x) * aspect;
  const cby = c.y - b.y;

  const magAB = Math.hypot(abx, aby);
  const magCB = Math.hypot(cbx, cby);
  if (magAB === 0 || magCB === 0) return null;

  const cosine = (abx * cbx + aby * cby) / (magAB * magCB);
  // Floating point can push the quotient a hair outside acos's domain.
  return (Math.acos(Math.min(1, Math.max(-1, cosine))) * 180) / Math.PI;
}

/** True when every joint named is present and confident enough. */
function allVisible(pose, joints, minVisibility) {
  return joints.every((j) => pose[j] && pose[j].score >= minVisibility);
}

/** Mean of the values that are actually numbers; null when none are. */
function meanDefined(values) {
  const defined = values.filter((v) => Number.isFinite(v));
  if (defined.length === 0) return null;
  return defined.reduce((sum, v) => sum + v, 0) / defined.length;
}

/**
 * Angle of the torso against the horizontal, in degrees (0..90).
 *
 * A push-up is performed roughly horizontal. A near-vertical torso means the
 * subject is standing, so whatever the arms are doing is not a push-up — this
 * is what stops arm-waving at the camera from running up a count.
 */
function torsoTiltFromHorizontal(pose, aspect = 1) {
  const shoulder = midpoint(pose.leftShoulder, pose.rightShoulder, aspect);
  const hip = midpoint(pose.leftHip, pose.rightHip, aspect);
  if (!shoulder || !hip) return null;

  const dx = Math.abs(shoulder.x - hip.x) * aspect;
  const dy = Math.abs(shoulder.y - hip.y);
  if (dx === 0 && dy === 0) return null;

  return (Math.atan2(dy, dx) * 180) / Math.PI;
}

/** Midpoint of two joints; falls back to whichever one exists. */
function midpoint(a, b) {
  if (a && b) return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, score: Math.min(a.score, b.score) };
  return a || b || null;
}

/**
 * A single normalised skeleton shape, so the rep analyser never learns which
 * model produced a frame.
 *
 * Pose models disagree on both the number of keypoints and their order:
 * MediaPipe BlazePose emits 33, MoveNet emits 17, and the indices do not line
 * up. Everything downstream consumes the named joints below instead, with one
 * adapter per model translating into it.
 *
 * Coordinates are normalised to the image: x and y in 0..1, origin top-left.
 * `score` is 0..1 confidence. A joint the model could not place is `null`.
 */

const JOINTS = [
  'nose',
  'leftShoulder',
  'rightShoulder',
  'leftElbow',
  'rightElbow',
  'leftWrist',
  'rightWrist',
  'leftHip',
  'rightHip',
  'leftKnee',
  'rightKnee',
  'leftAnkle',
  'rightAnkle',
];

/** MediaPipe Pose Landmarker (BlazePose, 33 points) -> joint name. */
const MEDIAPIPE_INDEX = {
  nose: 0,
  leftShoulder: 11,
  rightShoulder: 12,
  leftElbow: 13,
  rightElbow: 14,
  leftWrist: 15,
  rightWrist: 16,
  leftHip: 23,
  rightHip: 24,
  leftKnee: 25,
  rightKnee: 26,
  leftAnkle: 27,
  rightAnkle: 28,
};

/** MoveNet / PoseNet (COCO, 17 points) -> joint name. */
const MOVENET_INDEX = {
  nose: 0,
  leftShoulder: 5,
  rightShoulder: 6,
  leftElbow: 7,
  rightElbow: 8,
  leftWrist: 9,
  rightWrist: 10,
  leftHip: 11,
  rightHip: 12,
  leftKnee: 13,
  rightKnee: 14,
  leftAnkle: 15,
  rightAnkle: 16,
};

function point(raw, scoreKey) {
  if (!raw) return null;
  const x = raw.x;
  const y = raw.y;
  if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
  const score = raw[scoreKey];
  return { x, y, score: Number.isFinite(score) ? score : 1 };
}

function adapt(indexMap, scoreKey) {
  return (raw) => {
    const pose = {};
    if (!Array.isArray(raw)) {
      for (const joint of JOINTS) pose[joint] = null;
      return pose;
    }
    for (const joint of JOINTS) {
      pose[joint] = point(raw[indexMap[joint]], scoreKey);
    }
    return pose;
  };
}

/**
 * MediaPipe reports `visibility`; MoveNet reports `score`. Both mean "how sure
 * am I this joint is where I say it is", which is what the analyser gates on.
 */
const fromMediaPipe = adapt(MEDIAPIPE_INDEX, 'visibility');
const fromMoveNet = adapt(MOVENET_INDEX, 'score');

/** Bones to draw for the skeleton overlay. */
const SKELETON_BONES = [
  ['leftShoulder', 'rightShoulder'],
  ['leftShoulder', 'leftElbow'],
  ['leftElbow', 'leftWrist'],
  ['rightShoulder', 'rightElbow'],
  ['rightElbow', 'rightWrist'],
  ['leftShoulder', 'leftHip'],
  ['rightShoulder', 'rightHip'],
  ['leftHip', 'rightHip'],
  ['leftHip', 'leftKnee'],
  ['leftKnee', 'leftAnkle'],
  ['rightHip', 'rightKnee'],
  ['rightKnee', 'rightAnkle'],
];


/**
 * Counts push-ups from a stream of pose frames.
 *
 * The signal is the elbow angle (shoulder-elbow-wrist): ~170 degrees at the top
 * of a push-up, ~80 at the bottom. A rep is one down-then-up cycle, counted on
 * the way back up so the number matches completed reps rather than attempts —
 * the same rule the proximity path uses.
 *
 * Four things keep the count honest:
 *
 *   hysteresis     separate down/up thresholds, so an angle hovering on one
 *                  boundary cannot oscillate and inflate the count
 *   minPhaseMs     a phase must hold before it is committed, rejecting jitter
 *                  from a single bad inference
 *   minRepMs       the same 500ms floor between reps used elsewhere
 *   form gates     torso must be roughly horizontal and the body straight,
 *                  so arm-waving at the camera counts nothing
 *
 * The analyser is pure and deterministic: same frames in, same reps out, with
 * all timing taken from the caller's timestamps rather than the clock. That is
 * what makes it testable without a camera.
 */

const DEFAULTS = {
  /**
   * Adapt the thresholds to the range of movement actually observed.
   *
   * Fixed angles do not survive the projection: the elbow angle is measured on
   * a flat image, so a camera off the plane of the arm flattens it. Someone
   * going properly to the floor can measure 115 degrees, never cross a fixed
   * 100-degree threshold, and get no reps and no explanation. Deriving the
   * thresholds from each person's own observed range removes that failure,
   * and removes the per-setup tuning it would otherwise need.
   */
  autoCalibrate: true,
  /** How far back the observed range is measured. */
  calibrationWindowMs: 20000,
  /** Movement smaller than this is not a rep, it is noise or fidgeting. */
  minRangeDeg: 25,
  /** Where in the observed range the down/up thresholds sit. */
  rangeFraction: 0.3,
  /**
   * Absolute limits the adapted thresholds may not cross. Without these,
   * adapting to a tiny range would make a shallow twitch count as a full rep —
   * the arms still have to actually bend.
   */
  downAngleCeiling: 120,
  upAngleFloor: 140,

  /** Fallback thresholds, used until a range is known (or with autoCalibrate off). */
  downAngle: 100,
  /** Elbow angle at or above which the arms count as extended (top). */
  upAngle: 150,
  /** A dip past this that never reaches downAngle is a partial rep. */
  partialAngle: 135,
  /** Minimum landmark confidence before a joint is trusted. */
  minVisibility: 0.4,
  /** How long a phase must hold before it is committed. */
  minPhaseMs: 150,
  /** Minimum gap between two counted reps. */
  minRepMs: 500,
  /** Shoulder-hip-knee angle below which the body is sagging or piking. */
  straightBodyMinAngle: 150,
  /**
   * Whether bad body position *rejects* a rep rather than just warning.
   *
   * Off by default, because the measurement is not trustworthy enough to
   * refuse work over. The shoulder-hip-knee angle is read off a flat image, so
   * foreshortening from any camera not square to the body pulls it well below
   * 150 degrees even when the person is perfectly straight — the same
   * projection problem that made fixed elbow thresholds fail. Rejecting on it
   * meant a full set of real push-ups counted zero. The issue is still
   * reported, so the coaching is unchanged; only the veto is gone.
   */
  requireStraightBody: false,
  /**
   * Torso must get within this many degrees of horizontal at some point in the
   * rep. Judged on the best frame of the rep, not every frame: a single noisy
   * inference used to veto an otherwise good rep.
   */
  maxTorsoTilt: 55,
  /** Frame aspect ratio (width / height) for angle correction. */
  aspect: 1,
};

const ISSUES = {
  SHALLOW: 'shallow',
  BODY_SAG: 'bodySag',
  NOT_HORIZONTAL: 'notHorizontal',
  LOST_TRACKING: 'lostTracking',
};

const ARM_JOINTS = {
  left: ['leftShoulder', 'leftElbow', 'leftWrist'],
  right: ['rightShoulder', 'rightElbow', 'rightWrist'],
};

const BODY_JOINTS = {
  left: ['leftShoulder', 'leftHip', 'leftKnee'],
  right: ['rightShoulder', 'rightHip', 'rightKnee'],
};

function elbowAngle(pose, side, opts) {
  const joints = ARM_JOINTS[side];
  if (!allVisible(pose, joints, opts.minVisibility)) return null;
  const [shoulder, elbow, wrist] = joints.map((j) => pose[j]);
  return angleAt(shoulder, elbow, wrist, opts.aspect);
}

function bodyAngle(pose, side, opts) {
  const joints = BODY_JOINTS[side];
  if (!allVisible(pose, joints, opts.minVisibility)) return null;
  const [shoulder, hip, knee] = joints.map((j) => pose[j]);
  return angleAt(shoulder, hip, knee, opts.aspect);
}

/**
 * Measure one frame without any state. Exported so the UI can show live angles
 * and so the thresholds can be inspected in isolation.
 */
function measureFrame(pose, options = {}) {
  const opts = { ...DEFAULTS, ...options };
  if (!pose) return { tracking: false, elbow: null, body: null, torsoTilt: null };

  const elbow = meanDefined([elbowAngle(pose, 'left', opts), elbowAngle(pose, 'right', opts)]);
  const body = meanDefined([bodyAngle(pose, 'left', opts), bodyAngle(pose, 'right', opts)]);
  const torsoTilt = torsoTiltFromHorizontal(pose, opts.aspect);

  return { tracking: elbow !== null, elbow, body, torsoTilt };
}

function createPushupAnalyzer(options = {}) {
  const opts = { ...DEFAULTS, ...options };

  let phase = 'unknown'; // 'unknown' | 'up' | 'down'
  let reps = 0;
  let lastRepAt = -Infinity;

  let candidate = null; // phase we are waiting to confirm
  let candidateSince = 0;

  // Per-rep accumulators, reset when a descent begins.
  let minElbowInRep = Infinity;
  let worstBodyInRep = Infinity;
  /** Most horizontal reading of the rep — the rep's best evidence, not its worst. */
  let bestTiltInRep = Infinity;

  // A dip taken while still in the 'up' phase, i.e. one that never got deep
  // enough to commit a descent. Tracked outside the phase machine because a
  // shallow dip produces no phase change for the machine to react to.
  let inDip = false;
  let dipMin = Infinity;

  /** Recent elbow angles, for deriving this person's range of movement. */
  let samples = [];

  /**
   * Thresholds for the current frame: adapted to the observed range once there
   * is enough of it, otherwise the fixed fallbacks. Clamped so a small range
   * cannot turn a twitch into a rep.
   */
  function thresholdsFor(elbow, timestamp) {
    if (!opts.autoCalibrate) {
      return { down: opts.downAngle, up: opts.upAngle, adapted: false };
    }

    samples.push({ t: timestamp, elbow });
    const cutoff = timestamp - opts.calibrationWindowMs;
    if (samples.length > 4 && samples[0].t < cutoff) {
      samples = samples.filter((s) => s.t >= cutoff);
    }

    let min = Infinity;
    let max = -Infinity;
    for (const s of samples) {
      if (s.elbow < min) min = s.elbow;
      if (s.elbow > max) max = s.elbow;
    }

    const range = max - min;
    if (!Number.isFinite(range) || range < opts.minRangeDeg) {
      return { down: opts.downAngle, up: opts.upAngle, adapted: false };
    }

    const margin = range * opts.rangeFraction;
    return {
      down: Math.min(min + margin, opts.downAngleCeiling),
      up: Math.max(max - margin, opts.upAngleFloor),
      adapted: true,
      observedMin: min,
      observedMax: max,
    };
  }

  function resetRepAccumulators() {
    minElbowInRep = Infinity;
    worstBodyInRep = Infinity;
    bestTiltInRep = Infinity;
  }

  function clearDip() {
    inDip = false;
    dipMin = Infinity;
  }

  function result(extra) {
    return {
      reps,
      phase,
      repCompleted: false,
      partialRep: false,
      issues: [],
      elbow: null,
      body: null,
      torsoTilt: null,
      tracking: false,
      thresholds: null,
      ...extra,
    };
  }

  return {
    get reps() {
      return reps;
    },

    get phase() {
      return phase;
    },

    reset() {
      phase = 'unknown';
      reps = 0;
      lastRepAt = -Infinity;
      candidate = null;
      candidateSince = 0;
      samples = [];
      clearDip();
      resetRepAccumulators();
    },

    /**
     * Feed one pose frame.
     * @param {object} pose       normalised joints (see ./landmarks)
     * @param {number} timestamp  milliseconds, monotonic
     */
    push(pose, timestamp) {
      const { tracking, elbow, body, torsoTilt } = measureFrame(pose, opts);

      if (!tracking) {
        // Hold the phase rather than guessing: a dropped frame mid-descent
        // must not be read as the subject having come back up.
        candidate = null;
        return result({
          tracking: false,
          issues: [ISSUES.LOST_TRACKING],
          elbow,
          body,
          torsoTilt,
        });
      }

      if (Number.isFinite(torsoTilt)) bestTiltInRep = Math.min(bestTiltInRep, torsoTilt);

      minElbowInRep = Math.min(minElbowInRep, elbow);
      if (Number.isFinite(body)) worstBodyInRep = Math.min(worstBodyInRep, body);

      const limits = thresholdsFor(elbow, timestamp);

      // Instantaneous reading; null in the hysteresis band, where we hold.
      let observed = null;
      if (elbow <= limits.down) observed = 'down';
      else if (elbow >= limits.up) observed = 'up';

      let repCompleted = false;
      let partialRep = false;
      const issues = [];

      // Shallow-dip detection, before the phase machine. Bending to 130 and
      // coming back never crosses a threshold, so the machine sees nothing —
      // but "go lower" is exactly the feedback that moment calls for.
      if (phase === 'up') {
        if (elbow < limits.up) {
          inDip = true;
          dipMin = Math.min(dipMin, elbow);
        } else if (inDip) {
          // "Too shallow to count" is relative to where the down threshold
          // actually sits, so the advice stays honest under adaptation.
          const wasShallow = dipMin <= limits.down + (opts.upAngle - opts.partialAngle);
          clearDip();
          if (wasShallow) {
            partialRep = true;
            issues.push(ISSUES.SHALLOW);
          }
        }
      }

      if (observed && observed !== phase) {
        if (candidate !== observed) {
          candidate = observed;
          candidateSince = timestamp;
        }

        if (timestamp - candidateSince >= opts.minPhaseMs) {
          const previous = phase;
          phase = observed;
          candidate = null;

          if (phase === 'down') {
            // A real descent supersedes any dip we were tracking, so it must
            // not also be reported as a shallow rep on the way back up.
            clearDip();
            resetRepAccumulators();
            minElbowInRep = elbow;
            if (Number.isFinite(body)) worstBodyInRep = body;
            if (Number.isFinite(torsoTilt)) bestTiltInRep = torsoTilt;
          }

          if (phase === 'up' && previous === 'down') {
            // A full cycle finished. Decide whether it earns a count.
            //
            // Only two things veto a rep: not being in a push-up position at
            // all, and arriving impossibly soon after the last one. Body
            // position is reported but does not veto unless explicitly asked
            // for — see requireStraightBody.
            const notHorizontal =
              Number.isFinite(bestTiltInRep) && bestTiltInRep > opts.maxTorsoTilt;
            const sagging =
              Number.isFinite(worstBodyInRep) && worstBodyInRep < opts.straightBodyMinAngle;

            if (sagging) issues.push(ISSUES.BODY_SAG);

            if (notHorizontal) {
              issues.push(ISSUES.NOT_HORIZONTAL);
            } else if (opts.requireStraightBody && sagging) {
              /* vetoed by an explicit strictness setting */
            } else if (timestamp - lastRepAt >= opts.minRepMs) {
              reps += 1;
              lastRepAt = timestamp;
              repCompleted = true;
            }
            clearDip();
            resetRepAccumulators();
          }
        }
      } else if (observed === phase) {
        candidate = null;
      }

      return result({
        tracking: true,
        phase,
        reps,
        repCompleted,
        partialRep,
        issues,
        elbow,
        body,
        torsoTilt,
        thresholds: limits,
      });
    },
  };
}


/* ------------------------------------------------------------------------
 * Page: camera, MediaPipe, skeleton overlay, and the bridge to React Native.
 * --------------------------------------------------------------------- */
const MEDIAPIPE_VERSION = '1.0.1';
const CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MEDIAPIPE_VERSION;
const MODEL_URL =
  'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

const TARGET_FPS = 30;
const FRAME_INTERVAL_MS = Math.round(1000 / TARGET_FPS);
const STALE_FRAME_MS = 250;
const DRAW_MIN_SCORE = 0.4;
const MAX_CONSECUTIVE_ERRORS = 30;

const ACCENT = '#4ADE80';
const FAINT = '#55555E';

const videoEl = document.getElementById('video');
const canvasEl = document.getElementById('overlay');
const statusEl = document.getElementById('status');

let analyzer = null;
let landmarker = null;
let timer = null;
let stream = null;
let paused = false;
let wakeLock = null;
let delegateUsed = null;
let lastVideoTime = -1;
let lastInferenceAt = 0;
let consecutiveErrors = 0;

/** Post a message to the React Native host (no-op in a plain browser). */
function send(payload) {
  try {
    window.ReactNativeWebView?.postMessage(JSON.stringify(payload));
  } catch (e) {
    /* standalone browser */
  }
}

/**
 * Hold the screen awake.
 *
 * Doing push-ups means not touching the phone, so the display sleeps on its
 * usual ~30s timeout and takes the camera with it — the page looks like it
 * "switched itself off" moments after the model finished loading. The app has
 * expo-keep-awake for this; the page needs its own.
 *
 * The lock is released automatically whenever the page is hidden, so it has to
 * be taken again every time we become visible, not just once at startup.
 */
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => {
      wakeLock = null;
      updateSysLine();
    });
  } catch (e) {
    wakeLock = null; // denied, or not allowed in this context
  }
  updateSysLine();
}

/**
 * Coming back from a hidden state: the wake lock is gone, the video element is
 * usually paused, and the interval may have been throttled to a standstill.
 * Restore all three rather than leaving a frozen preview on screen.
 */
async function handleVisible() {
  if (document.visibilityState !== 'visible') return;
  acquireWakeLock();
  try {
    if (videoEl.srcObject && videoEl.paused) await videoEl.play();
  } catch (e) {
    /* autoplay policy — the track listener below reports a dead camera */
  }
  if (landmarker && analyzer && !timer) {
    timer = setInterval(tick, FRAME_INTERVAL_MS);
  }
}

/** Report a camera that has stopped for good, instead of showing black. */
function watchStream(mediaStream) {
  mediaStream.getVideoTracks().forEach((track) => {
    track.addEventListener('ended', () => {
      setStatus('The camera stopped. Tap here to restart.', true);
      statusEl.onclick = () => {
        statusEl.onclick = null;
        location.reload();
      };
      send({ type: 'status', phase: 'error', message: 'camera track ended' });
    });
  });
}

/**
 * @param {string|null} text     message, or null to hide
 * @param {boolean} isError      render in the error colour
 * @param {boolean} compact      banner across the top instead of a full cover,
 *                               for when the camera behind it should stay visible
 */
function setStatus(text, isError, compact) {
  if (!text) {
    statusEl.classList.add('hidden');
    return;
  }
  statusEl.textContent = text;
  statusEl.classList.remove('hidden');
  statusEl.classList.toggle('error', !!isError);
  statusEl.classList.toggle('compact', !!compact);
}

function draw(pose, tracking) {
  const width = videoEl.videoWidth;
  const height = videoEl.videoHeight;
  if (!width || !height) return;
  if (canvasEl.width !== width || canvasEl.height !== height) {
    canvasEl.width = width;
    canvasEl.height = height;
  }

  const ctx = canvasEl.getContext('2d');
  ctx.clearRect(0, 0, width, height);
  if (!pose) return;

  const at = (joint) => {
    const p = pose[joint];
    if (!p || p.score < DRAW_MIN_SCORE) return null;
    return { x: p.x * width, y: p.y * height };
  };

  const colour = tracking ? ACCENT : FAINT;
  ctx.strokeStyle = colour;
  ctx.fillStyle = colour;
  ctx.lineWidth = Math.max(2, width / 180);
  ctx.lineCap = 'round';

  for (const bone of SKELETON_BONES) {
    const a = at(bone[0]);
    const b = at(bone[1]);
    if (!a || !b) continue;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  for (const joint of Object.keys(pose)) {
    const p = at(joint);
    if (!p) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(3, width / 240), 0, Math.PI * 2);
    ctx.fill();
  }
}

/* --- diagnostic HUD ---------------------------------------------------- */

/**
 * Shown when the page is opened directly in a browser, or with ?debug=1.
 * Inside the app the WebView is covered by the app's own counter, so the HUD
 * would only be in the way. Opening the URL in a phone browser is therefore
 * the way to see what the model actually reads while training.
 */
const hudEl = document.getElementById('hud');
const hudReps = document.getElementById('hudReps');
const hudPhase = document.getElementById('hudPhase');
const hudIssue = document.getElementById('hudIssue');
const hudElbow = document.getElementById('hudElbow');
const hudBody = document.getElementById('hudBody');
const hudTilt = document.getElementById('hudTilt');
const hudFps = document.getElementById('hudFps');
const hudBarFill = document.getElementById('hudBarFill');
const hudCopied = document.getElementById('hudCopied');
const hudSys = document.getElementById('hudSys');
const hudDeepest = document.getElementById('hudDeepest');
const hudDeepestK = document.getElementById('hudDeepestK');

/**
 * Deepest elbow angle reached, against the angle actually required.
 *
 * This is the one number that explains a silent failure. If a rep never gets
 * below downAngle the analyser makes no phase transition at all, so it reports
 * no issue and no rep — the screen just sits there. Seeing "118 / need 100"
 * says immediately whether the problem is depth, the camera angle flattening
 * the measurement, or a threshold that is simply wrong for this setup.
 */
let deepestElbow = Infinity;
let lastNeeded = null;
let prevPhase = null;

/** Summary of the run, kept so a closed page still has something to report. */
const SUMMARY_KEY = 'pupg:lastPoseSession';
let sessionFrames = 0;
let trackedFrames = 0;
let lastSummaryWrite = 0;

function persistSummary(reps) {
  try {
    localStorage.setItem(SUMMARY_KEY, JSON.stringify({
      when: new Date().toISOString(),
      frames: sessionFrames,
      tracked: trackedFrames,
      deepestElbow: Number.isFinite(deepestElbow) ? Math.round(deepestElbow) : null,
      reps: reps,
      needed: lastNeeded == null ? DEFAULTS.downAngle : Math.round(lastNeeded),
      delegate: delegateUsed,
      stuckAt: coachState,
    }));
  } catch (e) {
    /* private mode */
  }
}

/** Show what happened last time, so a failed run is not lost on reload. */
function showLastSummary() {
  try {
    const raw = localStorage.getItem(SUMMARY_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s || !s.frames) return;
    const deep = s.deepestElbow == null ? 'never tracked' : s.deepestElbow + '° deepest';
    const why = s.stuckAt && s.stuckAt !== 'ready' ? ' — stuck at: ' + s.stuckAt : '';
    hudCopied.textContent =
      'Last run: ' + s.reps + ' reps, ' + deep + ' (need ' + s.needed + '°)' + why;
    setTimeout(() => { hudCopied.textContent = ''; }, 8000);
  } catch (e) {
    /* ignore */
  }
}

/**
 * Surfaces the two things that silently kill a session: the screen sleeping,
 * and which inference delegate actually loaded. Without this a phone that
 * switched itself off looks identical to one that crashed.
 */
function updateSysLine() {
  if (!hudSys) return;
  const lockOn = !!wakeLock;
  const lockSupported = 'wakeLock' in navigator;
  const lockText = !lockSupported
    ? '<span class="warn">screen lock: unsupported — set display timeout to Never</span>'
    : lockOn
      ? 'screen: staying awake'
      : '<span class="warn">screen: may sleep</span>';
  const fps = fpsWindow.length ? fpsWindow.length + 'fps' : '—';
  const tracked = sessionFrames
    ? Math.round((trackedFrames / sessionFrames) * 100) + '% tracked'
    : 'no frames';
  hudSys.innerHTML =
    lockText + ' &middot; ' + (delegateUsed || '—') + ' &middot; ' + fps + ' &middot; ' + tracked;
}

let hudEnabled = false;
let fpsWindow = [];

/**
 * Coaching messages must outlive the frame that produced them.
 *
 * The analyser reports "shallow" or "bodySag" only on the frame where the rep
 * finishes, so showing issues raw would flash the advice for one frame (~33ms)
 * and clear it — unreadable. Hold the last message briefly instead, and drop it
 * the moment a rep counts, since that is the answer to it.
 */
const ISSUE_STICKY_MS = 2200;
let stickyIssue = null;
let stickyIssueAt = 0;
/** Angle trace, so a real set can be sent back and thresholds tuned on data. */
const trace = [];
const TRACE_LIMIT = 6000;

const ISSUE_TEXT = {
  lostTracking: 'Step into frame',
  notHorizontal: 'Get into push-up position',
  bodySag: 'Keep your body straight',
  shallow: 'Go lower',
};

const coachEl = document.getElementById('coach');
const coachTitleEl = document.getElementById('coachTitle');
const coachBodyEl = document.getElementById('coachBody');

const SETUP_HELP = {
  noPose: ['No one in frame',
    'Prop the phone so your whole body is visible, about 2m away, and make sure the room is lit.'],
  noArms: ['Arms out of frame',
    'Your shoulder, elbow and wrist all have to be visible. Move the phone back or turn it sideways.'],
  notHorizontal: ['Get into a push-up position',
    'Lie face down with your body roughly level. Standing in front of the camera will not count.'],
  calibrating: ['Learning your range',
    'Do one full push-up — all the way down, all the way up — and counting starts.'],
};

let coachState = null;
let coachSince = 0;

/**
 * Work out which of the four silent failures is happening, rather than leaving
 * the screen at zero with no explanation.
 */
function setupState(pose, result) {
  if (!pose) return 'noPose';
  const seen = (j) => pose[j] && pose[j].score >= DEFAULTS.minVisibility;
  const arm = (side) =>
    seen(side + 'Shoulder') && seen(side + 'Elbow') && seen(side + 'Wrist');
  if (!arm('left') && !arm('right')) return 'noArms';
  if (Number.isFinite(result.torsoTilt) && result.torsoTilt > DEFAULTS.maxTorsoTilt) {
    return 'notHorizontal';
  }
  if (result.thresholds && !result.thresholds.adapted) return 'calibrating';
  return 'ready';
}

/** Debounced so a single dropped frame does not flash a setup warning. */
function updateCoach(pose, result, now) {
  if (!hudEnabled) return;
  const state = setupState(pose, result);

  if (state !== coachState) {
    coachState = state;
    coachSince = now;
  }
  const settled = now - coachSince > 700;

  if (state === 'ready' || !settled) {
    if (state === 'ready') coachEl.classList.add('hidden');
    return;
  }

  const help = SETUP_HELP[state];
  if (!help) {
    coachEl.classList.add('hidden');
    return;
  }
  coachTitleEl.textContent = help[0];
  coachBodyEl.textContent = help[1];
  coachEl.classList.toggle('good', state === 'calibrating');
  coachEl.classList.remove('hidden');
}

function updateHud(result) {
  if (!hudEnabled) return;

  const now = performance.now();
  fpsWindow.push(now);
  while (fpsWindow.length && now - fpsWindow[0] > 1000) fpsWindow.shift();

  const fmt = (v) => (Number.isFinite(v) ? Math.round(v) + '°' : '—');

  sessionFrames += 1;
  if (Number.isFinite(result.elbow)) {
    trackedFrames += 1;
    deepestElbow = Math.min(deepestElbow, result.elbow);
  }
  // Reset at the start of a descent, not when a rep completes: resetting on
  // completion immediately replaced a good depth with the angle of someone
  // standing at the top, which then rendered red and read as a failure. Held
  // this way, the cell shows the depth of the rep just finished until the next
  // one begins.
  if (result.phase === 'down' && prevPhase !== 'down') deepestElbow = Infinity;
  prevPhase = result.phase;

  hudReps.textContent = result.reps != null ? result.reps : 0;
  hudPhase.textContent = (result.phase || 'unknown').toUpperCase();
  hudPhase.className = result.phase === 'down' ? 'down' : result.phase === 'up' ? 'up' : '';
  hudElbow.textContent = fmt(result.elbow);
  hudBody.textContent = fmt(result.body);
  hudTilt.textContent = fmt(result.torsoTilt);

  // The target is whatever the analyser is currently using, which adapts to
  // the range this person actually moves through.
  const needed = result.thresholds ? result.thresholds.down : DEFAULTS.downAngle;
  hudDeepest.textContent = Number.isFinite(deepestElbow) ? Math.round(deepestElbow) + '°' : '—';
  hudDeepestK.textContent =
    'DEEPEST / ' + Math.round(needed) + '°' +
    (result.thresholds && result.thresholds.adapted ? ' AUTO' : '');
  hudDeepest.className =
    'v' + (Number.isFinite(deepestElbow) ? (deepestElbow <= needed ? ' ok' : ' bad') : '');
  lastNeeded = needed;

  if (now - lastSummaryWrite > 2000) {
    lastSummaryWrite = now;
    persistSummary(result.reps || 0);
    updateSysLine(); // refresh fps and tracked-percentage
  }

  hudElbow.className = 'v' + (Number.isFinite(result.elbow)
    ? (result.elbow <= DEFAULTS.downAngle ? ' ok' : '') : ' bad');
  hudBody.className = 'v' + (Number.isFinite(result.body)
    ? (result.body < DEFAULTS.straightBodyMinAngle ? ' bad' : ' ok') : '');
  hudTilt.className = 'v' + (Number.isFinite(result.torsoTilt)
    ? (result.torsoTilt > DEFAULTS.maxTorsoTilt ? ' bad' : ' ok') : '');

  const issue = (result.issues || [])[0];
  if (result.repCompleted) {
    stickyIssue = null;
  } else if (issue) {
    stickyIssue = ISSUE_TEXT[issue] || issue;
    stickyIssueAt = now;
  } else if (stickyIssue && now - stickyIssueAt > ISSUE_STICKY_MS) {
    stickyIssue = null;
  }
  hudIssue.textContent = stickyIssue || '';

  // Depth bar: full at the down threshold, empty when fully extended.
  if (Number.isFinite(result.elbow)) {
    const span = DEFAULTS.upAngle - DEFAULTS.downAngle;
    const pct = Math.max(0, Math.min(1, (DEFAULTS.upAngle - result.elbow) / span)) * 100;
    hudBarFill.style.width = pct.toFixed(0) + '%';
    hudBarFill.style.background = pct >= 100 ? '#4ADE80' : '#FBBF24';
  }

  if (trace.length < TRACE_LIMIT) {
    trace.push({
      t: Math.round(now),
      elbow: Number.isFinite(result.elbow) ? +result.elbow.toFixed(1) : null,
      body: Number.isFinite(result.body) ? +result.body.toFixed(1) : null,
      tilt: Number.isFinite(result.torsoTilt) ? +result.torsoTilt.toFixed(1) : null,
      phase: result.phase,
      reps: result.reps,
      rep: !!result.repCompleted,
      issues: result.issues && result.issues.length ? result.issues : undefined,
    });
  }
}

document.getElementById('hudReset').addEventListener('click', () => {
  if (analyzer) analyzer.reset();
  trace.length = 0;
  deepestElbow = Infinity;
  sessionFrames = 0;
  trackedFrames = 0;
  hudCopied.textContent = 'reset';
  setTimeout(() => { hudCopied.textContent = ''; }, 1200);
});

document.getElementById('hudCopy').addEventListener('click', async () => {
  const counted = trace.filter((r) => r.rep).length;
  const elbows = trace.map((r) => r.elbow).filter((v) => v != null);
  const payload = {
    thresholds: {
      downAngle: DEFAULTS.downAngle,
      upAngle: DEFAULTS.upAngle,
      straightBodyMinAngle: DEFAULTS.straightBodyMinAngle,
      maxTorsoTilt: DEFAULTS.maxTorsoTilt,
    },
    summary: {
      frames: trace.length,
      countedReps: counted,
      minElbow: elbows.length ? Math.min.apply(null, elbows) : null,
      maxElbow: elbows.length ? Math.max.apply(null, elbows) : null,
      trackedFrames: elbows.length,
    },
    trace: trace,
  };
  const text = JSON.stringify(payload);
  try {
    await navigator.clipboard.writeText(text);
    hudCopied.textContent = 'Copied ' + trace.length + ' frames, ' + counted + ' reps';
  } catch (e) {
    // Clipboard needs a user gesture and permission; fall back to selectable text.
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;bottom:0;left:0;width:100%;height:120px;z-index:99';
    document.body.appendChild(ta);
    ta.select();
    hudCopied.textContent = 'Select the text below and copy it';
  }
  setTimeout(() => { hudCopied.textContent = ''; }, 4000);
});

function tick() {
  if (!landmarker || !analyzer || videoEl.readyState < 2) return;

  const now = performance.now();
  const isNewFrame = videoEl.currentTime !== lastVideoTime;
  const isStale = now - lastInferenceAt >= STALE_FRAME_MS;
  if (!isNewFrame && !isStale) return;

  lastVideoTime = videoEl.currentTime;
  lastInferenceAt = now;

  try {
    const detection = landmarker.detectForVideo(videoEl, now);
    const raw = detection && detection.landmarks && detection.landmarks[0];
    const pose = raw ? fromMediaPipe(raw) : null;

    if (paused) {
      draw(pose, !!pose);
    } else {
      const result = pose
        ? analyzer.push(pose, now)
        : { tracking: false, issues: [ISSUES.LOST_TRACKING], reps: analyzer.reps };

      if (result.repCompleted) {
        send({ type: 'rep', reps: result.reps, elbow: result.elbow });
      }
      send({
        type: 'frame',
        tracking: !!result.tracking,
        phase: result.phase,
        issues: result.issues || [],
        reps: result.reps,
      });
      updateHud(result);
      updateCoach(pose, result, now);
      draw(pose, result.tracking);
    }
    consecutiveErrors = 0;
  } catch (e) {
    consecutiveErrors += 1;
    if (consecutiveErrors === MAX_CONSECUTIVE_ERRORS) {
      setStatus('Pose detection keeps failing: ' + (e && e.message ? e.message : e), true);
      send({ type: 'status', phase: 'error', message: String(e && e.message ? e.message : e) });
    }
  }
}

async function start() {
  try {
    setStatus('Starting camera…');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error(
        'This page must be served over HTTPS for camera access (getUserMedia is unavailable).',
      );
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false,
    });
    videoEl.srcObject = stream;
    watchStream(stream);
    await videoEl.play();
    await acquireWakeLock();

    // The camera is live from here on, so uncover it: the model download takes
    // a few seconds and that is exactly when someone wants to see the frame to
    // position the phone. Tell the app host too, so it can do the same.
    send({ type: 'status', phase: 'camera' });
    setStatus('Loading model… you can frame yourself now', false, true);
    const vision = await import(CDN + '/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks(CDN + '/wasm');

    // The GPU delegate is faster but fails or crashes outright on a fair
    // number of Android GPUs. Falling back to CPU costs frames; not falling
    // back costs the whole feature.
    const makeLandmarker = (delegate) =>
      vision.PoseLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: delegate },
        runningMode: 'VIDEO',
        numPoses: 1,
      });

    try {
      landmarker = await makeLandmarker('GPU');
      delegateUsed = 'GPU';
    } catch (gpuError) {
      setStatus('GPU unavailable, loading on CPU…', false, true);
      landmarker = await makeLandmarker('CPU');
      delegateUsed = 'CPU';
    }

    analyzer = createPushupAnalyzer({
      aspect: (videoEl.videoWidth || 640) / (videoEl.videoHeight || 480),
    });

    setStatus(null);
    send({ type: 'status', phase: 'ready' });

    // Inside the app the WebView sits behind the app's own counter, so the HUD
    // would just get in the way. Opened directly in a browser it is the point.
    hudEnabled = !window.ReactNativeWebView || /[?&]debug=1/.test(location.search);
    hudEl.classList.toggle('hidden', !hudEnabled);
    updateSysLine();
    if (hudEnabled) showLastSummary();

    timer = setInterval(tick, FRAME_INTERVAL_MS);
  } catch (e) {
    const message =
      e && e.name === 'NotAllowedError'
        ? 'Camera permission denied. Allow camera access, then reload.'
        : (e && e.message) || 'Could not start the camera.';
    setStatus(message, true);
    send({ type: 'status', phase: 'error', message });
  }
}

/** Commands from the React Native host. */
function handleCommand(rawData) {
  let msg;
  try {
    msg = JSON.parse(rawData);
  } catch (e) {
    return;
  }
  if (msg.type === 'pause') paused = true;
  else if (msg.type === 'resume') paused = false;
  else if (msg.type === 'reset') analyzer && analyzer.reset();
  else if (msg.type === 'mirror') {
    videoEl.classList.toggle('mirrored', !!msg.value);
    canvasEl.classList.toggle('mirrored', !!msg.value);
  }
}

// RN delivers injected messages on window on Android and document on iOS.
window.addEventListener('message', (e) => handleCommand(e.data));
document.addEventListener('message', (e) => handleCommand(e.data));

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    // Last chance to record the run: on mobile a page is often never given a
    // real unload, so a summary written only every 2s would lose the ending.
    persistSummary(analyzer ? analyzer.reps : 0);
  } else {
    handleVisible();
  }
});

/**
 * Only tear down on a real unload. The previous version stopped every track on
 * any `pagehide`, which also fires when the page goes into the back/forward
 * cache — so returning to it restored a page whose camera had been killed for
 * good, with nothing left to restart it.
 */
window.addEventListener('pagehide', (event) => {
  persistSummary(analyzer ? analyzer.reps : 0);
  if (event.persisted) return; // bfcache: we may be coming right back
  if (timer) clearInterval(timer);
  timer = null;
  if (stream) stream.getTracks().forEach((t) => t.stop());
});

start();
</script>
</body>
</html>
